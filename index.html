<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGbrainX — Upgrader</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Orbitron:wght@500;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Inter', sans-serif;
        }

        html { scroll-behavior: smooth; }

        body {
            background: #0a0a0f;
            color: #e5e7eb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .bg-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -2;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-layer::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 140, 0, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 140, 0, 0.08) 0%, transparent 40%);
            animation: bgMove 25s ease-in-out infinite;
        }

        @keyframes bgMove {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-5%, -5%) rotate(8deg); }
        }

        .app {
            width: 100%;
            max-width: 100%;
            background: linear-gradient(180deg, rgba(30, 30, 38, 0.95) 0%, rgba(18, 18, 22, 0.95) 100%);
            border-radius: 28px;
            border: 1px solid rgba(255, 140, 0, 0.15);
            box-shadow: 
                0 30px 80px rgba(0, 0, 0, 0.8),
                0 0 80px rgba(255, 140, 0, 0.06);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding-bottom: 25px;
            position: relative;
            backdrop-filter: blur(20px);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 140, 0, 0.1);
        }

        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #d0d0d0 0%, #ff8c00 50%, #ffaa33 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 15px rgba(255, 140, 0, 0.5));
            animation: logoGradient 4s ease infinite;
        }

        @keyframes logoGradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .top-right { display: flex; align-items: center; gap: 12px; }

        .balance {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
        }

        .coin-icon {
            width: 20px;
            height: 20px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(255, 140, 0, 0.8));
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff8c00, #cc7000);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 18px;
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 140, 0, 0.5);
            cursor: pointer;
            overflow: hidden;
            border: 2px solid rgba(255, 140, 0, 0.6);
            transition: transform 0.2s;
        }

        .avatar:hover { transform: scale(1.08); }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ===== ВКЛАДКИ ===== */
        .tabs {
            display: flex;
            gap: 10px;
            padding: 18px 30px 0;
        }

        .tab {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 0;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            color: #8a8d9b;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .tab svg {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            transition: all 0.3s;
        }

        .tab:hover {
            background: rgba(255, 140, 0, 0.08);
            border-color: rgba(255, 140, 0, 0.35);
            color: #ffaa33;
        }

        .tab.active {
            background: linear-gradient(135deg, rgba(255, 140, 0, 0.25), rgba(255, 140, 0, 0.1));
            border-color: #ff8c00;
            color: #fff;
            box-shadow: 0 0 25px rgba(255, 140, 0, 0.4);
        }

        .tab.active svg {
            filter: drop-shadow(0 0 8px rgba(255, 140, 0, 0.9));
        }

        /* ===== ПАНЕЛИ ВКЛАДОК ===== */
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* ===== МОДАЛЬНЫЕ ОКНА ===== */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .modal.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: linear-gradient(180deg, #1e1e26 0%, #121216 100%);
            border: 1px solid rgba(255, 140, 0, 0.3);
            border-radius: 24px;
            padding: 32px 28px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 
                0 30px 80px rgba(0, 0, 0, 0.9),
                0 0 60px rgba(255, 140, 0, 0.2);
            transform: scale(0.9);
            transition: transform 0.3s ease;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal.open .modal-card { transform: scale(1); }

        .modal-card.wide { max-width: 440px; text-align: left; }

        .profile-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff8c00;
            box-shadow: 
                0 0 30px rgba(255, 140, 0, 0.6),
                0 0 60px rgba(255, 140, 0, 0.3);
            margin-bottom: 18px;
        }

        .profile-nick {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .profile-tg {
            font-size: 14px;
            color: #ffaa33;
            font-weight: 700;
            margin-bottom: 20px;
            text-decoration: none;
            display: inline-block;
            transition: color 0.2s;
        }

        .profile-tg:hover { color: #ffcc66; text-shadow: 0 0 12px rgba(255, 170, 51, 0.8); }

        .profile-balance-label {
            font-size: 11px;
            color: #8a8d9b;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .profile-balance-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 900;
            color: #ff8c00;
            text-shadow: 0 0 25px rgba(255, 140, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .profile-balance-value img {
            width: 28px;
            height: 28px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(255, 140, 0, 0.9));
        }

        .modal-close {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #8a8d9b;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: rgba(255, 80, 80, 0.2);
            color: #ff6b6b;
            border-color: rgba(255, 80, 80, 0.4);
        }

        .modal-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .admin-badge {
            display: inline-block;
            padding: 4px 12px;
            background: linear-gradient(135deg, #ff8c00, #cc7000);
            border-radius: 12px;
            font-size: 10px;
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            font-family: 'Orbitron', sans-serif;
            box-shadow: 0 0 15px rgba(255, 140, 0, 0.6);
        }

        /* ===== ФОРМЫ ===== */
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 11px;
            color: #8a8d9b;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s;
            font-family: 'Orbitron', sans-serif;
        }

        .form-input:focus {
            outline: none;
            border-color: #ff8c00;
            background: rgba(255, 140, 0, 0.08);
            box-shadow: 0 0 20px rgba(255, 140, 0, 0.3);
        }

        .form-input::placeholder {
            color: #4a4d5e;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
        }

        .radio-row {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .radio-option {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            color: #8a8d9b;
            font-weight: 700;
            font-size: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Orbitron', sans-serif;
        }

        .radio-option:hover { border-color: rgba(255, 140, 0, 0.4); color: #ffaa33; }
        .radio-option.active {
            background: linear-gradient(135deg, rgba(255, 140, 0, 0.25), rgba(255, 140, 0, 0.1));
            border-color: #ff8c00;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 140, 0, 0.4);
        }

        .action-btn {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #ff8c00, #cc7000);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 25px rgba(255, 140, 0, 0.4);
            margin-top: 8px;
        }

        .action-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(255, 140, 0, 0.6);
        }

        .action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #3a3d4d;
            box-shadow: none;
        }

        .msg {
            margin-top: 12px;
            font-size: 13px;
            font-weight: 700;
            min-height: 18px;
            text-align: center;
        }

        .msg.ok { color: #7ed88a; text-shadow: 0 0 10px rgba(120, 200, 130, 0.5); }
        .msg.err { color: #ff6b6b; text-shadow: 0 0 10px rgba(255, 100, 100, 0.5); }

        /* ===== ПРОМОКОДЫ ===== */
        .promo-panel {
            padding: 30px;
            text-align: center;
        }

        .promo-panel h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .promo-panel p {
            color: #8a8d9b;
            font-size: 14px;
            margin-bottom: 22px;
        }

        .promo-input-wrap {
            display: flex;
            gap: 10px;
            max-width: 480px;
            margin: 0 auto;
        }

        .promo-input-wrap .form-input { flex: 1; text-transform: uppercase; }

        .promo-input-wrap .action-btn { width: auto; padding: 14px 28px; margin-top: 0; }

        /* ===== СПИСОК ПРОМОКОДОВ ===== */
        .promo-list {
            margin-top: 18px;
            max-height: 260px;
            overflow-y: auto;
            text-align: left;
        }

        .promo-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .promo-list-item .code {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            color: #ffaa33;
            letter-spacing: 1px;
        }

        .promo-list-item .info {
            color: #8a8d9b;
            font-size: 11px;
            font-weight: 600;
        }

        .promo-list-item .uses {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            color: #7ed88a;
            font-size: 12px;
        }

        .promo-list-item .uses.empty { color: #ff6b6b; }

        /* ===== ИГРА ===== */
        .progress-section {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 0 20px;
            position: relative;
        }

        .progress-wrapper {
            position: relative;
            width: 340px;
            height: 340px;
        }

        .progress-svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .progress-bg {
            fill: none;
            stroke: #1e1e26;
            stroke-width: 24;
        }

        .progress-bar {
            fill: none;
            stroke: url(#progressGradient);
            stroke-width: 24;
            stroke-linecap: round;
            stroke-dasharray: 816;
            stroke-dashoffset: 816;
            transition: stroke-dashoffset 0.3s ease;
            filter: drop-shadow(0 0 15px rgba(255, 140, 0, 0.8));
        }

        .arrow-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            pointer-events: none;
            z-index: 5;
            transition: transform 6s cubic-bezier(0.12, 0.8, 0.15, 1);
            transform-origin: center center;
        }

        .arrow-pointer {
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 28px solid #ff8c00;
            margin-top: 22px;
            filter: 
                drop-shadow(0 0 10px rgba(255, 140, 0, 1))
                drop-shadow(0 0 20px rgba(255, 140, 0, 0.6));
            position: relative;
        }

        .arrow-pointer::after {
            content: '';
            position: absolute;
            top: -34px;
            left: -6px;
            width: 12px;
            height: 12px;
            background: radial-gradient(circle at 30% 30%, #ffaa33, #ff8c00);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(255, 140, 0, 1);
        }

        .progress-center {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
        }

        .chance-big {
            font-family: 'Orbitron', sans-serif;
            font-size: 48px;
            font-weight: 900;
            color: #ff8c00;
            text-shadow: 0 0 30px rgba(255, 140, 0, 0.8);
            line-height: 1;
        }

        .chance-label {
            font-size: 14px;
            color: #7ed88a;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 8px;
            text-shadow: 0 0 10px rgba(120, 200, 130, 0.5);
            min-height: 18px;
        }

        .chance-label.medium { color: #ffaa33; text-shadow: 0 0 10px rgba(255, 140, 0, 0.5); }
        .chance-label.hidden { visibility: hidden; }

        .items-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 20px 30px;
        }

        .item-box {
            background: linear-gradient(145deg, #1e1e26 0%, #15151c 100%);
            border-radius: 18px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid rgba(255, 140, 0, 0.4);
            min-width: 160px;
            box-shadow: 0 0 30px rgba(255, 140, 0, 0.2);
            transition: all 0.3s;
        }

        .item-box .label {
            font-size: 11px;
            color: #8a8d9b;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .item-box img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.6));
        }

        .item-box .name {
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
            color: #fff;
            height: 32px;
            display: flex;
            align-items: center;
        }

        .item-box .price {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 800;
            color: #d0d0d0;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .price-coin {
            width: 16px;
            height: 16px;
            object-fit: contain;
        }

        .swap-arrow {
            font-size: 28px;
            color: #ff8c00;
            filter: drop-shadow(0 0 10px rgba(255, 140, 0, 0.8));
            animation: pulseArrow 2s ease-in-out infinite;
        }

        @keyframes pulseArrow {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.15); opacity: 1; }
        }

        .multipliers {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 0 30px 20px;
        }

        .mult-btn {
            flex: 1;
            max-width: 80px;
            padding: 12px 0;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            color: #8a8d9b;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mult-btn:hover {
            background: rgba(255, 140, 0, 0.1);
            border-color: rgba(255, 140, 0, 0.4);
            color: #ffaa33;
        }

        .mult-btn.active {
            background: linear-gradient(135deg, #ff8c00, #cc7000);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 140, 0, 0.5);
        }

        .upgrade-btn {
            width: calc(100% - 60px);
            max-width: 100%;
            margin: 0 auto;
            padding: 20px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, #ff8c00 0%, #ffaa33 50%, #ff8c00 100%);
            background-size: 200% 200%;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            box-shadow: 
                0 10px 30px rgba(255, 140, 0, 0.4),
                0 0 60px rgba(255, 140, 0, 0.2);
            transition: all 0.3s;
            animation: gradientShift 3s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .upgrade-btn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 
                0 20px 50px rgba(255, 140, 0, 0.6),
                0 0 100px rgba(255, 140, 0, 0.4);
        }

        .upgrade-btn:active { transform: scale(0.98); }

        .upgrade-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #3a3d4d;
            animation: none;
            box-shadow: none;
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            color: #8a8d9b;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
            padding: 0 30px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 14px;
            background: linear-gradient(180deg, #ff8c00, #cc7000);
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(255, 140, 0, 0.8);
        }

        .section-block { margin-top: 25px; }

        .target-row, .shop-row, .inventory-row {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 5px 30px 15px;
            scroll-behavior: smooth;
        }

        const myUsername = (USER.username || '').toLowerCase();

        if (myUsername === adminUsername) {
            isAdmin = true;
            document.getElementById('adminSection').style.display = 'block';
            console.log('[ADMIN] Доступ разрешён для', USER.username);
        } else {
            isAdmin = false;
            document.getElementById('adminSection').style.display = 'none';
            console.log('[ADMIN] Нет доступа. Ты:', USER.username, '| Нужен:', adminUsername);
        }
        openModal('profileModal');
    };

    window.openAdminPanel = function() {
        if (!isAdmin) return;
        renderAdminGrid();
        renderPromoList();
        openModal('adminModal');
    };

    // ===== ВКЛАДКИ =====
    window.switchTab = function(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));

        if (tab === 'upgrade') {
            document.getElementById('tabUpgrade').classList.add('active');
            document.getElementById('panelUpgrade').classList.add('active');
        } else {
            document.getElementById('tabPromo').classList.add('active');
            document.getElementById('panelPromo').classList.add('active');
        }
    };

    // ===== АДМИН: ВЫБОР ТИПА =====
    window.selectPromoType = function(type) {
        promoType = type;
        document.querySelectorAll('.radio-option').forEach(o => {
            o.classList.toggle('active', o.dataset.type === type);
        });
        document.getElementById('balanceGroup').style.display = type === 'balance' ? 'block' : 'none';
        document.getElementById('itemGroup').style.display = type === 'item' ? 'block' : 'none';
    };

    // ===== АДМИН: СЕТКА БРЕЙНРОТОВ =====
    function renderAdminGrid() {
        const grid = document.getElementById('adminGrid');
        grid.innerHTML = ITEMS.map(item => `
            <div class="admin-item ${selectedAdminItem === item.id ? 'selected' : ''}" 
                 onclick="selectAdminItem('${item.id}')">
                <img src="${item.img}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/42?text=?'">
                <div class="name">${item.name}</div>
            </div>
        `).join('');
    }

    window.selectAdminItem = function(id) {
        selectedAdminItem = id;
        renderAdminGrid();
    };

    // ===== АДМИН: СОЗДАНИЕ =====
    window.createPromo = async function() {
        const code = document.getElementById('adminCode').value.trim().toUpperCase();
        const uses = parseInt(document.getElementById('adminUses').value);
        const msg = document.getElementById('adminMsg');

        msg.className = 'msg';
        msg.textContent = '';

        if (!code || code.length < 3) {
            msg.className = 'msg err';
            msg.textContent = 'Название минимум 3 символа';
            return;
        }
        if (!uses || uses < 1) {
            msg.className = 'msg err';
            msg.textContent = 'Кол-во активаций минимум 1';
            return;
        }

        let value;
        if (promoType === 'balance') {
            value = parseInt(document.getElementById('adminBalance').value);
            if (!value || value < 1) {
                msg.className = 'msg err';
                msg.textContent = 'Сумма монет минимум 1';
                return;
            }
        } else {
            if (!selectedAdminItem) {
                msg.className = 'msg err';
                msg.textContent = 'Выбери брейнрот';
                return;
            }
            value = selectedAdminItem;
        }

        try {
            const res = await fetch(API_URL + '/api/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code, uses, type: promoType, value })
            });
            const data = await res.json();

            if (data.ok) {
                msg.className = 'msg ok';
                msg.textContent = 'Промокод создан: ' + code;
                document.getElementById('adminCode').value = '';
                document.getElementById('adminUses').value = 1;
                selectedAdminItem = null;
                renderAdminGrid();
                renderPromoList();
            } else {
                msg.className = 'msg err';
                msg.textContent = data.error || 'Ошибка';
            }
        } catch (err) {
            msg.className = 'msg err';
            msg.textContent = 'Сервер недоступен: ' + err.message;
            console.error(err);
        }
    };

    // ===== АДМИН: СПИСОК =====
    async function renderPromoList() {
        const list = document.getElementById('promoList');
        try {
            const res = await fetch(API_URL + '/api/promocodes');
            const data = await res.json();
            if (!data.ok) throw new Error(data.error);

            const codes = Object.values(data.promocodes || {});
            if (codes.length === 0) {
                list.innerHTML = '<div style="color:#4a4d5e; font-size:12px; text-align:center; padding:10px;">Промокодов пока нет</div>';
                return;
            }

            list.innerHTML = codes.map(p => {
                let rewardText = '';
                if (p.type === 'balance') {
                    rewardText = p.value + ' монет';
                } else {
                    const item = getItemById(p.value);
                    rewardText = item ? item.name : p.value;
                }
                return `
                    <div class="promo-list-item">
                        <div>
                            <div class="code">${p.code}</div>
                            <div class="info">${rewardText}</div>
                        </div>
                        <div class="uses ${p.uses <= 0 ? 'empty' : ''}">${p.uses} акт.</div>
                    </div>
                `;
            }).join('');
        } catch (err) {
            list.innerHTML = '<div style="color:#ff6b6b; font-size:12px; text-align:center; padding:10px;">Ошибка загрузки: ' + err.message + '</div>';
            console.error(err);
        }
    }

    // ===== АКТИВАЦИЯ =====
    window.activatePromo = async function() {
        const inputTab = document.getElementById('promoInput');
        const inputModal = document.getElementById('activateCode');
        const msgTab = document.getElementById('promoMsg');
        const msgModal = document.getElementById('activateMsg');

        const fromTab = document.getElementById('panelPromo').classList.contains('active');
        let code = fromTab ? inputTab.value.trim().toUpperCase() : inputModal.value.trim().toUpperCase();

        if (!code) {
            const m = fromTab ? msgTab : msgModal;
            m.className = 'msg err';
            m.textContent = 'Введи промокод';
            return;
        }

        try {
            const res = await fetch(API_URL + '/api/activate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code })
            });
            const data = await res.json();

            const m = fromTab ? msgTab : msgModal;

            if (data.ok) {
                if (data.type === 'balance') {
                    balance += data.value;
                    updateBalance();
                    m.className = 'msg ok';
                    m.textContent = `+${data.value} монет! Осталось активаций: ${data.remaining}`;
                } else {
                    inventory.push(data.value);
                    renderInventory();
                    renderTargets();
                    renderShop();
                    updateUpgradeScreen();
                    const item = getItemById(data.value);
                    m.className = 'msg ok';
                    m.textContent = `Получен: ${item ? item.name : data.value}! Осталось: ${data.remaining}`;
                }
                inputTab.value = '';
                inputModal.value = '';
            } else {
                m.className = 'msg err';
                m.textContent = data.error || 'Ошибка';
            }
        } catch (err) {
            const m = fromTab ? msgTab : msgModal;
            m.className = 'msg err';
            m.textContent = 'Сервер недоступен: ' + err.message;
            console.error(err);
        }
    };

    // ===== ИГРА =====
    function enableWheelScroll(el) {
        el.addEventListener('wheel', (e) => {
            if (el.scrollWidth <= el.clientWidth) return;
            e.preventDefault();
            el.scrollLeft += e.deltaY > 0 ? 300 : -300;
        }, { passive: false });
    }

    document.querySelectorAll('.mult-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            if (isSpinning) return;
            document.querySelectorAll('.mult-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMultiplier = parseFloat(btn.dataset.mult);
            updateUpgradeScreen();
        });
    });

    function renderShop() {
        shopRow.innerHTML = ITEMS.map(item => `
            <div class="shop-card">
                <img src="${item.img}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/60?text=?'">
                <div class="name">${item.name}</div>
                <div class="price"><img src="${COIN_IMG}" class="price-coin" alt="coin" style="width:12px;height:12px;">${item.price}</div>
                <button class="buy-btn" onclick="buyItem('${item.id}')" ${balance < item.price || isSpinning ? 'disabled' : ''}>Купить</button>
            </div>
        `).join('');
    }

    function buyItem(id) {
        if (isSpinning) return;
        const item = getItemById(id);
        if (!item || balance < item.price) return;
        balance -= item.price;
        inventory.push(id);
        updateBalance();
        renderShop();
        renderInventory();
        updateUpgradeScreen();
    }

    window.sellItem = function(id) {
        if (isSpinning) return;
        const index = inventory.indexOf(id);
        if (index === -1) return;
        const item = getItemById(id);
        if (!item) return;

        inventory.splice(index, 1);
        balance += item.price;

        if (selectedSourceId === id && !inventory.includes(id)) {
            selectedSourceId = null;
            selectedTargetId = null;
        }

        updateBalance();
        renderInventory();
        renderTargets();
        renderShop();
        updateUpgradeScreen();
    };

    function renderInventory() {
        if (inventory.length === 0) {
            inventoryRow.innerHTML = '<div class="empty-inv">Инвентарь пуст</div>';
            return;
        }
        const counts = {};
        inventory.forEach(id => { counts[id] = (counts[id] || 0) + 1; });
        inventoryRow.innerHTML = Object.keys(counts).map(id => {
            const item = getItemById(id);
            const count = counts[id];
            const isSelected = selectedSourceId === id;
            return `
                <div class="inv-card ${isSelected ? 'selected' : ''}">
                    <div class="selectable" onclick="selectSource('${id}')">
                        <img src="${item.img}" alt="${item.name}">
                        <div class="name">${item.name}</div>
                        <div class="price"><img src="${COIN_IMG}" class="price-coin" alt="coin" style="width:12px;height:12px;">${item.price}${count > 1 ? ` (x${count})` : ''}</div>
                    </div>
                    <button class="sell-btn" onclick="event.stopPropagation(); sellItem('${id}')" ${isSpinning ? 'disabled' : ''}>
                        Продать
                    </button>
                </div>
            `;
        }).join('');
    }

    window.selectSource = function(id) {
        if (isSpinning) return;
        if (!inventory.includes(id)) return;
        selectedSourceId = id;
        selectedTargetId = null;
        renderInventory();
        renderTargets();
        updateUpgradeScreen();
    };

    function renderTargets() {
        const sourceItem = selectedSourceId ? getItemById(selectedSourceId) : null;
        targetRow.innerHTML = ITEMS.map(item => {
            const isSelected = selectedTargetId === item.id;
            const isDisabled = sourceItem && item.price <= sourceItem.price;
            return `
                <div class="target-card ${isSelected ? 'selected' : ''} ${isDisabled ? 'disabled' : ''}" 
                     onclick="${isDisabled ? '' : `selectTarget('${item.id}')`}">
                    <img src="${item.img}" alt="${item.name}">
                    <div class="name">${item.name}</div>
                    <div class="price"><img src="${COIN_IMG}" class="price-coin" alt="coin" style="width:12px;height:12px;">${item.price}</div>
                </div>
            `;
        }).join('');
    }

    window.selectTarget = function(id) {
        if (isSpinning) return;
        const sourceItem = selectedSourceId ? getItemById(selectedSourceId) : null;
        const targetItem = getItemById(id);
        if (sourceItem && targetItem.price <= sourceItem.price) return;
        selectedTargetId = id;
        renderTargets();
        updateUpgradeScreen();
    };

    function calculateChance() {
        const sourceItem = selectedSourceId ? getItemById(selectedSourceId) : null;
        const targetItem = selectedTargetId ? getItemById(selectedTargetId) : null;
        if (!sourceItem || !targetItem || targetItem.price <= sourceItem.price) return 0;

        let chance = (sourceItem.price / targetItem.price) * 100;
        chance = chance / currentMultiplier * 3;
        if (chance > MAX_CHANCE) chance = MAX_CHANCE;
        if (chance < 0) chance = 0;
        return chance;
    }

    function updateUpgradeScreen() {
        const sourceItem = selectedSourceId ? getItemById(selectedSourceId) : null;
        const targetItem = selectedTargetId ? getItemById(selectedTargetId) : null;

        if (sourceItem) {
            sourceImg.src = sourceItem.img;
            sourceImg.style.display = 'block';
            sourceName.innerText = sourceItem.name;
            sourcePrice.innerHTML = `<img src="${COIN_IMG}" class="price-coin" alt="coin">${sourceItem.price}`;
        } else {
            sourceImg.style.display = 'none';
            sourceName.innerText = '—';
            sourcePrice.innerHTML = '';
        }

        if (targetItem) {
            targetImg.src = targetItem.img;
            targetImg.style.display = 'block';
            targetName.innerText = targetItem.name;
            targetPrice.innerHTML = `<img src="${COIN_IMG}" class="price-coin" alt="coin">${targetItem.price}`;
        } else {
            targetImg.style.display = 'none';
            targetName.innerText = '—';
            targetPrice.innerHTML = '';
        }

        const chance = calculateChance();
        const displayChance = Math.floor(chance);

        const offset = CIRCUMFERENCE - (chance / 100) * CIRCUMFERENCE;
        progressBar.style.strokeDashoffset = offset;

        const angle = (chance / 100) * 360;
        arrowContainer.style.transform = `rotate(${angle}deg)`;

        chanceBig.innerText = displayChance + '%';

        if (displayChance >= 60) {
            chanceLabel.innerText = 'ВЫСОКИЙ ШАНС';
            chanceLabel.className = 'chance-label';
        } else if (displayChance >= 30) {
            chanceLabel.innerText = 'СРЕДНИЙ ШАНС';
            chanceLabel.className = 'chance-label medium';
        } else {
            chanceLabel.innerText = '';
            chanceLabel.className = 'chance-label hidden';
        }

        if (sourceItem && targetItem && chance > 0 && !isSpinning) {
            upgradeBtn.disabled = false;
            upgradeBtn.innerText = `Апгрейд - ${displayChance}%`;
        } else {
            upgradeBtn.disabled = true;
            upgradeBtn.innerText = 'Апгрейд - 0%';
        }
    }

    upgradeBtn.addEventListener('click', () => {
        if (isSpinning) return;
        const sourceItem = getItemById(selectedSourceId);
        const targetItem = getItemById(selectedTargetId);
        if (!sourceItem || !targetItem) return;
        if (targetItem.price <= sourceItem.price) return;

        const chance = calculateChance();
        if (chance <= 0) return;

        isSpinning = true;
        upgradeBtn.disabled = true;
        upgradeBtn.innerText = 'КРУТИМ...';

        inventoryRow.classList.add('locked');
        targetRow.classList.add('locked');
        shopRow.classList.add('locked');

        const baseRotation = 360 * 8;
        const randomAngle = Math.random() * 360;
        const totalRotation = baseRotation + randomAngle;

        arrowContainer.style.transition = `transform ${SPIN_DURATION}ms cubic-bezier(0.12, 0.8, 0.15, 1)`;
        arrowContainer.style.transform = `rotate(${totalRotation}deg)`;

        const successAngle = (chance / 100) * 360;
        const finalAngle = totalRotation % 360;
        const isSuccess = finalAngle <= successAngle;

        setTimeout(() => {
            if (isSuccess) {
                const sourceIndex = inventory.indexOf(selectedSourceId);
                if (sourceIndex > -1) inventory.splice(sourceIndex, 1);
                inventory.push(selectedTargetId);
            } else {
                const sourceIndex = inventory.indexOf(selectedSourceId);
                if (sourceIndex > -1) inventory.splice(sourceIndex, 1);
            }

            selectedSourceId = null;
            selectedTargetId = null;

            isSpinning = false;

            updateBalance();
            renderInventory();
            renderTargets();
            renderShop();
            updateUpgradeScreen();

            arrowContainer.style.transition = 'none';
            arrowContainer.style.transform = 'rotate(0deg)';

            upgradeBtn.disabled = true;
            inventoryRow.classList.remove('locked');
            targetRow.classList.remove('locked');
            shopRow.classList.remove('locked');
        }, SPIN_DURATION + 100);
    });

    function init() {
        updateBalance();
        renderInventory();
        renderTargets();
        renderShop();
        updateUpgradeScreen();
        renderAdminGrid();

        enableWheelScroll(targetRow);
        enableWheelScroll(shopRow);
        enableWheelScroll(inventoryRow);
    }

    init();
</script>

<script>
    const bgMusic = document.getElementById('bgMusic');
    bgMusic.volume = 0.15;

    function startMusic() {
        bgMusic.play().catch(err => console.log('Аудио заблокировано:', err));
        document.removeEventListener('click', startMusic);
        document.removeEventListener('touchstart', startMusic);
    }

    document.addEventListener('click', startMusic);
    document.addEventListener('touchstart', startMusic);
</script>

</body>
</html>
