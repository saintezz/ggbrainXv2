<style>
/* ============================================================
   BRAINROT ZONE — ULTIMATE DESIGN SYSTEM v2.0
   Glassmorphism + Neumorphism + Aurora + Micro-interactions
   ============================================================ */

/* ---------- DESIGN TOKENS ---------- */
:root{
  /* Accent (управляется через JS) */
  --accent:#f5c542; --accent-deep:#b8860b; --accent-bright:#ffe066;
  --accent-dim:rgba(245,197,66,.3); --accent-very-dim:rgba(245,197,66,.1);
  --green:#2ecc71; --green-deep:#1e8449; --green-bright:#58d68d; --green-dim:rgba(46,204,113,.25);
  --lime:#a3e635; --teal:#14b8a6; --amber:#f59e0b; --emerald:#10b981;
  --rare-gold:#ffd700;

  /* Surface system */
  --bg-0:#02060a;
  --bg-1:#050d08;
  --bg-2:#071410;
  --surface-1:rgba(15,35,22,.42);
  --surface-2:rgba(15,35,22,.62);
  --surface-3:rgba(15,35,22,.82);
  --surface-glass:rgba(255,255,255,.04);
  --surface-glass-hi:rgba(255,255,255,.08);

  /* Borders */
  --border-subtle:rgba(245,197,66,.12);
  --border-default:rgba(245,197,66,.22);
  --border-strong:rgba(245,197,66,.42);
  --border-glass:rgba(255,255,255,.08);

  /* Text */
  --text-primary:#f1f5f9;
  --text-secondary:#a8b0bd;
  --text-muted:#6a7280;
  --text-disabled:#4a4d5e;

  /* Shadows (layered) */
  --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.3);
  --shadow-md:0 4px 16px rgba(0,0,0,.4), 0 8px 32px rgba(0,0,0,.3);
  --shadow-lg:0 12px 48px rgba(0,0,0,.5), 0 24px 80px rgba(0,0,0,.4);
  --shadow-xl:0 30px 90px rgba(0,0,0,.6), 0 0 120px rgba(46,204,113,.08);
  --shadow-glow-accent:0 0 32px rgba(245,197,66,.35);
  --shadow-glow-green:0 0 32px rgba(46,204,113,.35);

  /* Layout */
  --app-bg-alpha:.35;
  --card-img-size:52px;
  --card-name-size:9px;
  --roulette-item-width:130px;
  --radius-sm:10px;
  --radius-md:14px;
  --radius-lg:18px;
  --radius-xl:24px;

  /* Motion */
  --ease-out:cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring:cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-smooth:cubic-bezier(0.4, 0, 0.2, 1);

  /* Fonts */
  --font-ui:'Manrope','Unbounded',sans-serif;
  --font-display:'Unbounded',sans-serif;

  /* Legacy compatibility (must keep!) */
  --glass-bg:rgba(15,35,22,.4);
  --glass-bg-strong:rgba(15,35,22,.6);
  --glass-border:rgba(245,197,66,.2);
  --glass-highlight:rgba(255,255,255,.06);
}

/* ---------- RESET ---------- */
*,*::before,*::after{
  box-sizing:border-box;margin:0;padding:0;
  user-select:none;font-family:var(--font-ui);font-weight:600;
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}

/* ---------- BODY — AURORA + MESH ---------- */
body{
  background:var(--bg-0);
  color:var(--text-primary);
  min-height:100vh;
  display:flex;flex-direction:column;align-items:stretch;
  padding:0 0 110px;
  position:relative;
  overflow-x:hidden;overflow-y:auto;
  font-weight:600;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  isolation:isolate;
}

/* Aurora mesh background */
body::before{
  content:'';
  position:fixed;inset:-20%;
  z-index:-5;
  background:
    radial-gradient(ellipse 60% 40% at 15% 20%, rgba(46,204,113,.18), transparent 60%),
    radial-gradient(ellipse 50% 50% at 85% 15%, rgba(245,197,66,.14), transparent 60%),
    radial-gradient(ellipse 70% 50% at 50% 90%, rgba(20,184,166,.12), transparent 60%),
    radial-gradient(ellipse 40% 40% at 90% 80%, rgba(163,230,53,.10), transparent 60%);
  animation:auroraDrift 30s ease-in-out infinite;
  filter:blur(40px);
  pointer-events:none;
}
@keyframes auroraDrift{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(-3%,2%) scale(1.05)}
  66%{transform:translate(2%,-2%) scale(.97)}
}

/* Noise overlay */
body::after{
  content:'';
  position:fixed;inset:0;z-index:-1;pointer-events:none;
  opacity:.035;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  mix-blend-mode:overlay;
}

/* ---------- PARTICLES / BG LAYERS ---------- */
#particles{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden;contain:strict}
.particle{
  position:absolute;width:3px;height:3px;border-radius:50%;
  background:var(--accent);opacity:.25;
  animation:particleFloat linear infinite;
  will-change:transform;
  box-shadow:0 0 6px currentColor;
}
.particle.green{background:var(--green);color:var(--green)}
.particle.lime{background:var(--lime);color:var(--lime)}
.particle.teal{background:var(--teal);color:var(--teal)}
@keyframes particleFloat{
  0%{transform:translate3d(0,0,0);opacity:0}
  10%{opacity:.5}
  90%{opacity:.5}
  100%{transform:translate3d(30px,-100vh,0);opacity:0}
}

#bgVideo{
  position:fixed;top:0;left:0;width:100%;height:100%;
  object-fit:cover;z-index:-4;opacity:.22;pointer-events:none;
  filter:saturate(1.2) contrast(1.1);
}

.bg-layer{
  position:fixed;inset:0;z-index:-3;overflow:hidden;pointer-events:none;contain:strict;
}
.bg-layer::before{
  content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:
    radial-gradient(circle at 20% 30%,rgba(46,204,113,.10) 0,transparent 40%),
    radial-gradient(circle at 80% 70%,rgba(245,197,66,.10) 0,transparent 40%);
  animation:bgMove 25s ease-in-out infinite;
  will-change:transform;
}
@keyframes bgMove{
  0%,100%{transform:translate3d(0,0,0) rotate(0)}
  50%{transform:translate3d(-5%,-5%,0) rotate(8deg)}
}

.bg-grid{
  position:fixed;inset:0;z-index:-2;pointer-events:none;
  background-image:
    linear-gradient(rgba(46,204,113,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(46,204,113,.035) 1px,transparent 1px);
  background-size:48px 48px;
  -webkit-mask-image:radial-gradient(circle at 50% 50%,#000 25%,transparent 78%);
  mask-image:radial-gradient(circle at 50% 50%,#000 25%,transparent 78%);
}

/* ---------- TOASTS ---------- */
#toastContainer{
  position:fixed;top:20px;right:20px;z-index:99998;
  display:flex;flex-direction:column;gap:10px;pointer-events:none;
}
.toast{
  padding:14px 20px;
  border-radius:var(--radius-md);
  background:linear-gradient(135deg,rgba(15,35,22,.92),rgba(10,25,15,.92));
  border:1px solid var(--border-default);
  font-size:13px;font-weight:800;color:#fff;
  box-shadow:var(--shadow-lg),inset 0 1px 0 rgba(255,255,255,.08);
  animation:toastIn .4s var(--ease-spring),toastOut .35s ease 3.7s forwards;
  max-width:340px;display:flex;align-items:center;gap:10px;
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  position:relative;overflow:hidden;
}
.toast::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--accent),var(--green));
}
.toast.ok{border-color:var(--green-bright);box-shadow:var(--shadow-lg),0 0 24px rgba(88,214,141,.25)}
.toast.ok::before{background:var(--green-bright)}
.toast.err{border-color:#ff6b6b;box-shadow:var(--shadow-lg),0 0 24px rgba(255,107,107,.25)}
.toast.err::before{background:#ff6b6b}
.toast.info::before{background:var(--accent)}
@keyframes toastIn{from{opacity:0;transform:translateX(40px) scale(.9)}to{opacity:1;transform:translateX(0) scale(1)}}
@keyframes toastOut{to{opacity:0;transform:translateX(40px) scale(.9)}}

/* ---------- APP SHELL ---------- */
.app{
  width:100%;max-width:1440px;margin:0 auto;
  background:linear-gradient(180deg,rgba(10,25,15,.55),rgba(5,15,10,.65));
  backdrop-filter:blur(28px) saturate(160%);
  -webkit-backdrop-filter:blur(28px) saturate(160%);
  border:1px solid var(--border-default);
  border-top:none;
  border-radius:0 0 var(--radius-xl) var(--radius-xl);
  box-shadow:var(--shadow-xl),inset 0 1px 0 rgba(255,255,255,.06);
  overflow:hidden;display:flex;flex-direction:column;
  padding-bottom:28px;position:relative;flex:1 0 auto;
  contain:layout paint style;
}
.app::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);
  pointer-events:none;
}
@media (min-width:1000px){
  body{padding:0 24px 120px}
  .app{border:1px solid var(--border-default);border-radius:var(--radius-xl)}
}

/* ---------- NAVIGATION ---------- */
.nav-panel{
  position:fixed;bottom:16px;left:50%;
  display:flex;flex-direction:row;flex-wrap:nowrap;gap:8px;z-index:500;
  padding:10px 12px;border-radius:20px;
  background:linear-gradient(180deg,rgba(15,35,22,.92),rgba(8,20,12,.92));
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--border-default);
  box-shadow:var(--shadow-lg),inset 0 1px 0 rgba(255,255,255,.08),0 0 60px rgba(46,204,113,.06);
  max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none;
  align-items:flex-end;
  will-change:transform;
  transform:translateX(-50%) translateZ(0);
}
.nav-panel::-webkit-scrollbar{display:none}

.nav-btn{
  width:48px;height:48px;min-width:48px;min-height:48px;
  border-radius:14px;
  border:1px solid transparent;
  background:rgba(255,255,255,.03);
  color:var(--text-secondary);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .3s var(--ease-out);
  padding:0;overflow:hidden;flex-shrink:0;
  position:relative;
}
.nav-btn::after{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:radial-gradient(circle at center,rgba(245,197,66,.2),transparent 70%);
  opacity:0;transition:opacity .3s;
  pointer-events:none;
}
.nav-btn svg{width:22px;height:22px;flex-shrink:0;transition:color .2s,transform .3s var(--ease-spring);position:relative;z-index:1}
.nav-btn img{width:100%;height:100%;object-fit:contain;padding:4px;position:relative;z-index:1}
.nav-btn:hover{
  background:rgba(255,255,255,.06);
  border-color:var(--border-default);
  color:var(--accent-bright);
  transform:translateY(-3px);
}
.nav-btn:hover::after{opacity:1}
.nav-btn:hover svg{transform:scale(1.1)}
.nav-btn.active{
  background:linear-gradient(135deg,var(--accent-very-dim),var(--accent-dim));
  border-color:var(--accent);
  color:#fff;
  box-shadow:0 0 24px rgba(245,197,66,.35),inset 0 1px 0 rgba(255,255,255,.15);
}
.nav-btn.active svg{color:var(--accent-bright);filter:drop-shadow(0 0 6px currentColor)}

.nav-btn-fuse{
  position:relative;
  width:62px;height:62px;min-width:62px;min-height:62px;
  border-radius:16px;
  border:1px solid #ff6a00;
  background:linear-gradient(135deg,rgba(255,106,0,.28),rgba(179,0,0,.4));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;padding:3px;overflow:visible;
  box-shadow:0 0 24px rgba(255,85,0,.35),inset 0 1px 0 rgba(255,255,255,.15);
}
.nav-btn-fuse img{
  width:44px;height:44px;object-fit:contain;
  filter:drop-shadow(0 0 8px #ff5500);
  animation:fusePulse 2s ease-in-out infinite;
  will-change:transform;
}
@keyframes fusePulse{
  0%,100%{transform:scale(1);filter:drop-shadow(0 0 8px #ff5500)}
  50%{transform:scale(1.08);filter:drop-shadow(0 0 14px #ff7700)}
}
.nav-btn-fuse .fuse-label{
  font-family:var(--font-display);font-size:8px;font-weight:900;
  color:#ff8c1a;letter-spacing:1.5px;line-height:1;
  text-shadow:0 0 6px rgba(255,140,26,.6);
}
.nav-btn-fuse.active{
  background:linear-gradient(135deg,#ff6a00,#b30000);
  border-color:#ffb366;
  box-shadow:0 0 32px rgba(255,106,0,.6),inset 0 1px 0 rgba(255,255,255,.25);
}
.nav-btn-fuse.active .fuse-label{color:#fff;text-shadow:0 0 8px rgba(255,255,255,.5)}

/* ---------- TOP BAR ---------- */
.top-bar{
  display:flex;justify-content:space-between;align-items:center;
  padding:16px 24px;
  background:linear-gradient(180deg,rgba(255,255,255,.03),transparent);
  border-bottom:1px solid var(--border-default);
  position:relative;
}
.top-bar::after{
  content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--green),var(--accent),transparent);
  opacity:.5;
}
.top-left{display:flex;align-items:center;gap:12px}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo-img{
  height:64px;width:auto;max-width:min(62vw,380px);
  object-fit:contain;display:block;
  filter:drop-shadow(0 6px 20px rgba(0,0,0,.6)) drop-shadow(0 0 24px rgba(245,197,66,.25));
  transition:transform .4s var(--ease-spring),filter .4s;
}
.logo-wrap:hover .logo-img{transform:scale(1.04);filter:drop-shadow(0 6px 20px rgba(0,0,0,.6)) drop-shadow(0 0 32px rgba(245,197,66,.45))}
@media (max-width:600px){.logo-img{height:46px;max-width:70vw}}

.online-dot{
  width:10px;height:10px;border-radius:50%;
  background:var(--emerald);
  animation:onlinePulse 1.5s ease-in-out infinite;
  box-shadow:0 0 12px var(--emerald);
}
@keyframes onlinePulse{
  0%,100%{opacity:1;transform:scale(1);box-shadow:0 0 12px var(--emerald)}
  50%{opacity:.6;transform:scale(1.35);box-shadow:0 0 20px var(--emerald)}
}

.top-right{display:flex;align-items:center;gap:12px}

.balance-wrap{
  display:flex;align-items:center;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));
  border:1px solid var(--border-default);
  border-radius:var(--radius-md);
  overflow:hidden;
  transition:transform .3s var(--ease-spring);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),var(--shadow-sm);
}
.balance-wrap.pulse{animation:balancePulse .6s var(--ease-spring)}
@keyframes balancePulse{
  0%{transform:scale(1)}
  40%{transform:scale(1.06)}
  100%{transform:scale(1)}
}
.balance{
  padding:9px 14px;
  font-size:14px;font-weight:800;
  display:flex;align-items:center;gap:6px;
  color:#fff;font-family:var(--font-display);
  letter-spacing:.02em;
}
.coin-icon{width:16px;height:16px;object-fit:contain;filter:drop-shadow(0 0 4px rgba(245,197,66,.6))}

.topup-btn{
  width:40px;height:100%;min-height:40px;
  border:none;
  background:linear-gradient(135deg,var(--accent),var(--amber));
  color:#0a1a0f;
  font-family:var(--font-display);font-size:20px;font-weight:900;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  border-left:1px solid var(--accent-deep);
  transition:filter .2s,transform .2s;
  position:relative;overflow:hidden;
}
.topup-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.4) 50%,transparent 70%);
  transform:translateX(-100%);transition:transform .5s;
}
.topup-btn:hover{filter:brightness(1.15)}
.topup-btn:hover::before{transform:translateX(100%)}

.avatar{
  width:42px;height:42px;border-radius:12px;
  background:linear-gradient(135deg,var(--green),var(--accent));
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;overflow:hidden;
  border:1px solid var(--border-default);
  transition:transform .3s var(--ease-spring),box-shadow .3s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),var(--shadow-sm);
}
.avatar:hover{transform:scale(1.08);box-shadow:0 0 20px rgba(245,197,66,.4),inset 0 1px 0 rgba(255,255,255,.2)}
.avatar img{width:100%;height:100%;object-fit:cover}

/* ---------- TAB PANELS ---------- */
.tab-panel{display:none}
.tab-panel.active{display:block;animation:panelFadeIn .4s var(--ease-out)}
@keyframes panelFadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ---------- MODALS ---------- */
.modal{
  position:fixed;inset:0;
  background:rgba(0,0,0,.82);
  backdrop-filter:blur(12px) saturate(120%);
  -webkit-backdrop-filter:blur(12px) saturate(120%);
  display:flex;justify-content:center;align-items:center;
  z-index:3000;opacity:0;pointer-events:none;
  transition:opacity .3s var(--ease-out);
  padding:14px;
}
.modal.open{opacity:1;pointer-events:auto}
.modal-card{
  background:linear-gradient(180deg,rgba(15,30,20,.98),rgba(8,20,12,.98));
  border:1px solid var(--border-default);
  border-radius:var(--radius-lg);
  padding:28px 24px;
  width:100%;max-width:460px;
  text-align:center;
  box-shadow:var(--shadow-xl),inset 0 1px 0 rgba(255,255,255,.08);
  transform:scale(.94) translateY(8px);
  transition:transform .35s var(--ease-spring);
  position:relative;max-height:92vh;overflow-y:auto;
}
.modal.open .modal-card{transform:scale(1) translateY(0)}
.modal-card.wide{max-width:680px;text-align:left;padding:28px 26px}
.modal-close{
  position:absolute;top:16px;right:16px;
  width:36px;height:36px;border-radius:10px;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.05);
  color:var(--text-secondary);
  font-size:15px;font-weight:900;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;z-index:5;
}
.modal-close:hover{
  background:rgba(255,80,80,.2);
  color:#ff6b6b;
  border-color:rgba(255,80,80,.4);
  transform:rotate(90deg);
}
.modal-title{
  font-family:var(--font-display);font-size:18px;font-weight:800;
  color:#fff;margin-bottom:22px;
  text-transform:uppercase;letter-spacing:2px;
  background:linear-gradient(135deg,#fff,var(--accent-bright));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}

/* ---------- FORM ---------- */
.form-group{margin-bottom:16px;text-align:left}
.form-label{
  display:block;font-size:11px;color:var(--text-secondary);
  font-weight:800;text-transform:uppercase;letter-spacing:1.5px;
  margin-bottom:8px;
}
.form-input{
  width:100%;padding:14px 16px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border-default);
  background:rgba(255,255,255,.04);
  color:#fff;font-size:14px;font-weight:700;
  font-family:var(--font-ui);
  transition:all .25s var(--ease-out);
  outline:none;
}
.form-input:focus{
  border-color:var(--accent);
  background:var(--accent-very-dim);
  box-shadow:0 0 0 3px rgba(245,197,66,.15),0 0 24px rgba(245,197,66,.15);
}
.form-input::placeholder{color:var(--text-disabled);font-weight:600}

.radio-row{display:flex;gap:10px;margin-bottom:16px}
.radio-option{
  flex:1;padding:12px;border-radius:var(--radius-sm);
  border:1px solid var(--border-default);
  background:rgba(255,255,255,.03);
  color:var(--text-secondary);
  font-weight:800;font-size:12px;text-align:center;
  cursor:pointer;transition:all .25s var(--ease-out);
  text-transform:uppercase;letter-spacing:1px;
}
.radio-option:hover{background:rgba(255,255,255,.06);transform:translateY(-1px)}
.radio-option.active{
  background:var(--accent-very-dim);
  border-color:var(--accent);
  color:#fff;
  box-shadow:0 0 20px rgba(245,197,66,.2),inset 0 1px 0 rgba(255,255,255,.1);
}

/* ---------- BUTTONS ---------- */
.action-btn{
  width:100%;padding:16px;
  border-radius:var(--radius-md);
  border:1px solid var(--border-default);
  background:linear-gradient(135deg,var(--green),var(--accent));
  color:#0a1a0f;
  font-family:var(--font-display);font-size:13px;font-weight:900;
  text-transform:uppercase;letter-spacing:2px;
  cursor:pointer;
  transition:all .3s var(--ease-out);
  margin-top:12px;
  position:relative;overflow:hidden;
  box-shadow:0 4px 20px rgba(46,204,113,.25),inset 0 1px 0 rgba(255,255,255,.25);
}
.action-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);
  transform:translateX(-100%);transition:transform .6s var(--ease-out);
}
.action-btn:hover:not(:disabled){
  filter:brightness(1.08);
  transform:translateY(-2px);
  box-shadow:0 8px 30px rgba(46,204,113,.4),inset 0 1px 0 rgba(255,255,255,.25);
}
.action-btn:hover:not(:disabled)::before{transform:translateX(100%)}
.action-btn:active:not(:disabled){transform:translateY(0)}
.action-btn:disabled{
  opacity:.4;cursor:not-allowed;background:#3a3d4d;
  box-shadow:none;
}

.msg{
  margin-top:12px;font-size:12px;font-weight:800;
  min-height:18px;text-align:center;
}
.msg.ok{color:var(--green-bright)}
.msg.err{color:#ff6b6b}
.msg.wait{color:var(--accent-bright)}

/* ============================================================
   CASES PAGE
   ============================================================ */
.cases-page{padding:0 0 20px}
.cases-header{display:flex;flex-direction:column;gap:12px;padding:20px 24px 12px}
.cases-search{
  width:100%;padding:15px 22px;
  border-radius:var(--radius-md);
  border:1px solid var(--border-default);
  background:rgba(0,0,0,.3);
  color:#fff;font-size:14px;font-weight:700;
  outline:none;
  transition:all .3s var(--ease-out);
}
.cases-search:focus{
  border-color:var(--accent);
  background:var(--accent-very-dim);
  box-shadow:0 0 0 3px rgba(245,197,66,.15),0 0 32px rgba(245,197,66,.2);
}
.cases-search::placeholder{color:var(--text-disabled)}

.cases-title-main{
  font-family:var(--font-display);
  font-size:clamp(28px,4.5vw,46px);
  font-weight:900;
  color:#fff;
  letter-spacing:.22em;
  text-transform:uppercase;
  text-align:center;
  padding:12px 0 6px;
  background:linear-gradient(135deg,var(--green-bright),var(--accent-bright),var(--green-bright),var(--accent-bright));
  background-size:300% 300%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  animation:logoGradient 5s ease infinite;
  filter:drop-shadow(0 0 30px rgba(245,197,66,.3));
}
.cases-subtitle-main{
  color:var(--text-secondary);font-size:12px;font-weight:700;
  text-align:center;letter-spacing:.5px;margin-bottom:20px;
}
@keyframes logoGradient{
  0%,100%{background-position:0 50%}
  50%{background-position:100% 50%}
}

.cases-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;padding:0 24px;
}
@media (min-width:640px){.cases-grid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1000px){.cases-grid{grid-template-columns:repeat(4,1fr)}}
@media (min-width:1300px){.cases-grid{grid-template-columns:repeat(5,1fr)}}

/* ---------- CASE CARD (hero) ---------- */
.case-card{
  position:relative;
  border-radius:var(--radius-lg);
  background:linear-gradient(180deg,rgba(255,255,255,.05) 0%,rgba(255,255,255,.015) 100%);
  border:1px solid var(--border-subtle);
  overflow:hidden;
  transition:all .45s var(--ease-out);
  cursor:pointer;
  box-shadow:var(--shadow-md),inset 0 1px 0 rgba(255,255,255,.06);
}
.case-card::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 0%,rgba(245,197,66,.18),transparent 70%);
  opacity:0;transition:opacity .45s;z-index:0;
}
.case-card::after{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.06) 50%,transparent 70%);
  transform:translateX(-120%);transition:transform .9s var(--ease-out);
  pointer-events:none;z-index:1;
}
.case-card:hover::before{opacity:1}
.case-card:hover::after{transform:translateX(120%)}
.case-card:hover{
  border-color:var(--accent);
  transform:translateY(-8px) scale(1.02);
  box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 48px rgba(245,197,66,.25),inset 0 1px 0 rgba(255,255,255,.1);
}

.case-card-inner{
  position:relative;display:flex;flex-direction:column;
  padding:22px 18px 18px;align-items:center;gap:16px;z-index:2;
}
.case-img-wrap{
  position:relative;width:100%;aspect-ratio:1;
  border-radius:var(--radius-md);
  overflow:hidden;
  background:radial-gradient(circle at 50% 45%,rgba(46,204,113,.18) 0,rgba(0,0,0,.5) 70%);
  border:1px solid rgba(46,204,113,.25);
  display:flex;align-items:center;justify-content:center;
}
.case-img-wrap::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.2) 50%,transparent 70%);
  transform:translateX(-120%);transition:transform .9s var(--ease-out);
}
.case-card:hover .case-img-wrap::after{transform:translateX(120%)}
.case-img-wrap img{
  width:80%;height:80%;object-fit:contain;
  transition:transform .45s var(--ease-spring);
  filter:drop-shadow(0 8px 24px rgba(0,0,0,.7));
}
.case-card:hover .case-img-wrap img{transform:scale(1.12) translateY(-4px)}

.case-info{width:100%;text-align:center}
.case-name{
  font-family:var(--font-display);font-size:14px;font-weight:800;
  color:#fff;letter-spacing:.04em;text-transform:uppercase;
  margin-bottom:8px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.case-price{
  font-family:var(--font-display);font-size:14px;font-weight:900;
  color:#0a1a0f;
  background:linear-gradient(135deg,var(--accent),var(--amber));
  padding:8px 16px;border-radius:10px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  box-shadow:0 4px 16px rgba(245,197,66,.3),inset 0 1px 0 rgba(255,255,255,.3);
  transition:filter .2s,transform .2s;
}
.case-card:hover .case-price{filter:brightness(1.1);transform:scale(1.05)}
.case-price img{width:14px;height:14px}
.case-price.free-tag{background:linear-gradient(135deg,var(--green),var(--accent))}
.case-items-count{
  font-size:10px;color:var(--text-muted);font-weight:700;
  margin-top:8px;letter-spacing:.5px;
}

/* ---------- CASE OPEN MODAL ---------- */
.case-open-modal{
  position:fixed;inset:0;z-index:4000;
  display:none;flex-direction:column;align-items:center;
  background:radial-gradient(circle at 50% 0,rgba(15,35,22,.98) 0,rgba(5,8,12,.99) 100%);
  overflow-y:auto;padding:20px 0 40px;
}
.case-open-modal.show{display:flex;animation:caseModalIn .35s var(--ease-out)}
@keyframes caseModalIn{from{opacity:0}to{opacity:1}}

.case-open-header{
  width:100%;max-width:1100px;padding:0 24px;
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:20px;
}
.case-back-btn{
  padding:10px 22px;border-radius:10px;
  border:1px solid var(--border-default);
  background:rgba(255,255,255,.06);
  color:var(--text-secondary);
  font-family:var(--font-display);font-size:12px;font-weight:800;
  letter-spacing:1px;cursor:pointer;
  transition:all .25s var(--ease-out);
}
.case-back-btn:hover{
  border-color:var(--accent);color:var(--accent-bright);
  background:var(--accent-very-dim);
  transform:translateX(-3px);
}
.case-open-balance{
  display:flex;align-items:center;gap:6px;
  font-family:var(--font-display);font-size:14px;font-weight:900;
  color:#fff;padding:10px 18px;
  background:rgba(0,0,0,.5);
  border-radius:10px;
  border:1px solid var(--border-default);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
}
.case-open-balance img{width:18px;height:18px;filter:drop-shadow(0 0 4px rgba(245,197,66,.6))}

.case-open-main-img{
  width:220px;height:220px;object-fit:contain;margin:10px auto;
  filter:drop-shadow(0 0 50px rgba(46,204,113,.6)) drop-shadow(0 0 20px rgba(245,197,66,.3));
  animation:caseMainFloat 3s ease-in-out infinite;
  will-change:transform;
}
@keyframes caseMainFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-12px)}
}
.case-open-name{
  font-family:var(--font-display);font-size:26px;font-weight:900;
  color:#fff;letter-spacing:4px;text-transform:uppercase;
  text-align:center;margin-bottom:26px;
  text-shadow:0 0 30px rgba(245,197,66,.4);
}

/* ---------- ROULETTE ---------- */
.case-roulette-wrapper{width:100%;max-width:1100px;padding:0 20px;margin-bottom:22px}
.case-roulette-container{width:100%;display:flex;flex-direction:column;gap:12px;align-items:center}
.case-roulette-row{
  width:100%;position:relative;overflow:hidden;
  border-radius:var(--radius-md);
  background:linear-gradient(180deg,rgba(0,0,0,.7),rgba(0,0,0,.5));
  border:1px solid rgba(46,204,113,.4);
  height:150px;
  box-shadow:inset 0 0 40px rgba(0,0,0,.8),0 0 30px rgba(46,204,113,.12),inset 0 1px 0 rgba(255,255,255,.05);
}
.case-roulette-row::before,.case-roulette-row::after{
  content:'';position:absolute;top:0;bottom:0;width:70px;z-index:8;pointer-events:none;
}
.case-roulette-row::before{left:0;background:linear-gradient(90deg,rgba(5,8,12,.98),transparent)}
.case-roulette-row::after{right:0;background:linear-gradient(270deg,rgba(5,8,12,.98),transparent)}

.case-roulette-track{display:flex;align-items:center;height:100%;will-change:transform}
.case-roulette-item{
  flex:0 0 var(--roulette-item-width,130px);
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:8px;
  border-right:1px solid rgba(255,255,255,.06);
  position:relative;
  transition:background .2s;
}
.case-roulette-item img{width:70px;height:70px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(0,0,0,.6))}
.case-roulette-item .roulette-name{
  font-size:9px;font-weight:800;color:#e5e7ef;text-align:center;
  line-height:1.1;height:22px;overflow:hidden;width:100%;
}
.case-roulette-item .roulette-price{
  font-family:var(--font-display);font-size:10px;font-weight:900;
  color:var(--accent-bright);
  display:flex;align-items:center;gap:3px;
}
.case-roulette-item .roulette-price img{width:12px;height:12px}

.case-roulette-item.winner{
  background:radial-gradient(circle at 50% 50%,rgba(245,197,66,.5),rgba(46,204,113,.2));
  box-shadow:inset 0 0 40px rgba(245,197,66,.6);
  animation:winnerPulse .6s ease-in-out 3;
}
@keyframes winnerPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.08)}
}
.case-roulette-item.winner::before{
  content:'';position:absolute;inset:0;
  border:2px solid var(--accent-bright);
  border-radius:10px;
  box-shadow:0 0 30px var(--accent-bright);
  animation:winnerBorder 1s ease-in-out infinite;
}
@keyframes winnerBorder{
  0%,100%{opacity:.6}
  50%{opacity:1}
}

.case-roulette-pointer{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:3px;height:100%;
  background:linear-gradient(180deg,transparent,var(--accent) 15%,var(--accent-bright) 50%,var(--accent) 85%,transparent);
  z-index:10;pointer-events:none;
  box-shadow:0 0 16px var(--accent),0 0 32px rgba(245,197,66,.5);
}
.case-roulette-pointer::before{
  content:'';position:absolute;top:-10px;left:50%;transform:translateX(-50%);
  width:0;height:0;
  border-left:11px solid transparent;
  border-right:11px solid transparent;
  border-top:16px solid var(--accent);
  filter:drop-shadow(0 0 8px var(--accent));
}
.case-roulette-pointer::after{
  content:'';position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);
  width:0;height:0;
  border-left:11px solid transparent;
  border-right:11px solid transparent;
  border-bottom:16px solid var(--accent);
  filter:drop-shadow(0 0 8px var(--accent));
}

/* ---------- QTY / OPEN BUTTON ---------- */
.case-qty-row{
  display:flex;gap:10px;margin-bottom:20px;
  width:100%;max-width:600px;padding:0 24px;
}
.case-qty-btn-big{
  flex:1;padding:16px 10px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border-default);
  background:rgba(255,255,255,.04);
  color:var(--text-secondary);
  font-family:var(--font-display);font-size:18px;font-weight:900;
  cursor:pointer;
  transition:all .3s var(--ease-out);
}
.case-qty-btn-big:hover{
  border-color:var(--accent);color:var(--accent-bright);
  transform:translateY(-2px);
  background:rgba(245,197,66,.08);
}
.case-qty-btn-big.active{
  background:linear-gradient(135deg,var(--accent),var(--amber));
  border-color:var(--accent-bright);
  color:#0a1a0f;
  box-shadow:0 0 28px rgba(245,197,66,.5),inset 0 1px 0 rgba(255,255,255,.3);
  transform:translateY(-2px);
}

.case-open-action-btn{
  width:100%;max-width:600px;padding:18px;
  border-radius:var(--radius-md);
  border:1px solid var(--border-default);
  background:linear-gradient(135deg,#2ecc71,#f5c542);
  color:#0a1a0f;
  font-family:var(--font-display);font-size:16px;font-weight:900;
  letter-spacing:4px;text-transform:uppercase;
  cursor:pointer;
  transition:all .3s var(--ease-out);
  margin-bottom:26px;
  box-shadow:0 8px 32px rgba(46,204,113,.3),inset 0 1px 0 rgba(255,255,255,.25);
  position:relative;overflow:hidden;
}
.case-open-action-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);
  transform:translateX(-100%);transition:transform .8s var(--ease-out);
}
.case-open-action-btn:hover:not(:disabled){
  filter:brightness(1.15);
  transform:translateY(-3px);
  box-shadow:0 14px 44px rgba(46,204,113,.5),inset 0 1px 0 rgba(255,255,255,.25);
}
.case-open-action-btn:hover:not(:disabled)::before{transform:translateX(100%)}
.case-open-action-btn:disabled{opacity:.4;cursor:not-allowed;background:#3a3d4d;box-shadow:none}

/* ---------- POSSIBLE DROPS ---------- */
.case-possible-title{
  width:100%;max-width:1100px;padding:0 24px;
  font-family:var(--font-display);font-size:12px;font-weight:900;
  color:var(--text-secondary);letter-spacing:4px;text-transform:uppercase;
  margin-bottom:14px;
}
.case-possible-grid{
  width:100%;max-width:1100px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
  gap:12px;padding:0 20px;
}
.case-possible-item{
  background:linear-gradient(180deg,rgba(15,35,22,.7),rgba(15,35,22,.4));
  border:1px solid rgba(46,204,113,.25);
  border-radius:var(--radius-sm);
  padding:12px 6px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  transition:all .25s var(--ease-out);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}
.case-possible-item:hover{
  border-color:var(--accent);
  transform:translateY(-3px);
  box-shadow:0 8px 24px rgba(0,0,0,.4),0 0 20px rgba(245,197,66,.15);
}
.case-possible-item img{width:56px;height:56px;object-fit:contain}
.case-possible-item .cp-name{
  font-size:9px;color:#e5e7ef;font-weight:800;
  text-align:center;line-height:1.1;height:22px;overflow:hidden;
}
.case-possible-item .cp-price{
  font-family:var(--font-display);font-size:11px;color:var(--accent-bright);
  font-weight:900;display:flex;align-items:center;gap:3px;
}
.case-possible-item .cp-price img{width:12px;height:12px}
.case-possible-item .cp-chance{font-size:8px;color:var(--text-muted);font-weight:800}

/* ---------- CASE OPEN ANIMATION ---------- */
.case-anim-overlay{
  position:fixed;inset:0;z-index:9999;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 50%,rgba(46,204,113,.35) 0,rgba(0,0,0,.98) 70%);
  overflow:hidden;
}
.case-anim-overlay.show{display:flex;animation:caseFadeIn .35s var(--ease-out)}
@keyframes caseFadeIn{from{opacity:0}to{opacity:1}}

.case-anim-bg{
  position:absolute;inset:0;
  background:
    radial-gradient(circle at 30% 40%,rgba(46,204,113,.3) 0,transparent 50%),
    radial-gradient(circle at 70% 60%,rgba(245,197,66,.25) 0,transparent 50%);
  pointer-events:none;
  animation:bgPulse 2s ease-in-out infinite;
}
@keyframes bgPulse{0%,100%{opacity:.7}50%{opacity:1}}

.case-anim-box{
  position:relative;width:220px;height:220px;z-index:2;
  animation:caseBoxShake .45s ease-in-out infinite alternate;
}
@keyframes caseBoxShake{
  from{transform:rotate(-5deg) scale(1)}
  to{transform:rotate(5deg) scale(1.1)}
}
.case-anim-box img{
  width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 0 50px #2ecc71) drop-shadow(0 0 90px rgba(245,197,66,.5));
}
.case-anim-text{
  font-family:var(--font-display);font-size:24px;font-weight:900;
  letter-spacing:8px;color:#58d68d;
  margin-top:32px;z-index:2;
  animation:caseTextPulse 1.2s ease-in-out infinite;
  text-shadow:0 0 24px rgba(88,214,141,.7);
}
@keyframes caseTextPulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.6;transform:scale(1.08)}
}
.case-anim-particles{position:absolute;inset:0;z-index:1;pointer-events:none}

/* ---------- RESULT ---------- */
.case-result-card{
  background:linear-gradient(180deg,rgba(15,30,20,.99),rgba(8,20,12,.99)) !important;
  border:1px solid rgba(46,204,113,.6) !important;
  padding:36px 28px !important;
  position:relative;overflow:hidden;
  border-radius:var(--radius-xl) !important;
  box-shadow:0 30px 80px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.08) !important;
}
.case-result-card.legend{
  border-color:var(--rare-gold) !important;
  box-shadow:0 0 80px rgba(255,215,0,.5),0 30px 80px rgba(0,0,0,.9) !important;
}
.case-result-card.legend::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 30%,rgba(255,215,0,.25),transparent 60%);
  pointer-events:none;
  animation:legendGlow 2s ease-in-out infinite;
}
@keyframes legendGlow{0%,100%{opacity:.6}50%{opacity:1}}

.case-result-label{
  font-family:var(--font-display);font-size:13px;font-weight:900;
  color:#58d68d;letter-spacing:4px;text-transform:uppercase;
  margin-bottom:20px;position:relative;z-index:1;
}
.case-result-card.legend .case-result-label{
  color:var(--rare-gold);
  text-shadow:0 0 20px rgba(255,215,0,.8);
}
.case-result-img-wrap{
  position:relative;width:160px;height:160px;
  margin:0 auto 18px;
  display:flex;align-items:center;justify-content:center;
  z-index:1;
}
.case-result-img-wrap img{
  width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 0 24px #2ecc71);
}
.case-result-card.legend .case-result-img-wrap img{
  filter:drop-shadow(0 0 32px var(--rare-gold)) drop-shadow(0 0 70px rgba(255,215,0,.6));
  animation:legendFloat 2s ease-in-out infinite;
}
@keyframes legendFloat{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-10px) scale(1.06)}
}

.case-result-name{
  font-family:var(--font-display);font-size:17px;font-weight:900;
  color:#fff;letter-spacing:2px;margin-bottom:8px;
  text-align:center;position:relative;z-index:1;
}
.case-result-price{
  font-family:var(--font-display);font-size:26px;font-weight:900;
  color:#58d68d;letter-spacing:2px;margin-bottom:22px;
  text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;
  position:relative;z-index:1;
}
.case-result-card.legend .case-result-price{color:var(--rare-gold)}
.case-result-price img{width:24px;height:24px;object-fit:contain}

.case-multi-results{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));
  gap:12px;margin-top:14px;position:relative;z-index:1;
}
.case-multi-item{
  background:rgba(0,0,0,.55);
  border:1px solid rgba(46,204,113,.4);
  border-radius:var(--radius-sm);
  padding:12px 8px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  animation:multiItemIn .45s var(--ease-spring) both;
}
@keyframes multiItemIn{
  from{opacity:0;transform:scale(.5) translateY(20px)}
  to{opacity:1;transform:scale(1) translateY(0)}
}
.case-multi-item.legend{
  border-color:var(--rare-gold);
  box-shadow:0 0 24px rgba(255,215,0,.4);
}
.case-multi-item img{width:52px;height:52px;object-fit:contain}
.case-multi-item .multi-name{
  font-size:9px;color:#e5e7ef;font-weight:800;
  text-align:center;line-height:1.1;height:22px;overflow:hidden;
}
.case-multi-item .multi-price{
  font-family:var(--font-display);font-size:11px;color:var(--accent-bright);
  font-weight:900;display:flex;align-items:center;gap:4px;
}
.case-multi-item .multi-price img{width:12px;height:12px}

.case-multi-summary{
  margin-top:18px;padding:16px;
  background:rgba(0,0,0,.55);
  border:1px solid rgba(46,204,113,.4);
  border-radius:var(--radius-md);
  position:relative;z-index:1;
}
.case-multi-summary > div{
  display:flex;justify-content:space-between;align-items:center;
  font-family:var(--font-display);font-size:13px;font-weight:900;
  color:var(--text-secondary);letter-spacing:1.5px;text-transform:uppercase;
  padding:6px 0;
}
.case-multi-summary > div > span{color:#58d68d;font-size:15px}
.case-multi-summary > div > span.profit{color:#58d68d}
.case-multi-summary > div > span.loss{color:#ff6b6b}

/* ============================================================
   UPGRADER
   ============================================================ */
.progress-section{
  display:flex;justify-content:center;align-items:center;
  padding:32px 0 16px;position:relative;
}
.progress-wrapper{position:relative;width:320px;height:320px}
.progress-svg{width:100%;height:100%;transform:rotate(-90deg)}
.progress-bg{fill:none;stroke:rgba(30,30,38,.8);stroke-width:22}
.progress-bar{
  fill:none;stroke:url(#progressGradient);stroke-width:22;
  stroke-linecap:butt;stroke-dasharray:816;stroke-dashoffset:816;
  transition:stroke-dashoffset .4s var(--ease-out);
  filter:drop-shadow(0 0 12px rgba(245,197,66,.4));
}
.arrow-container{
  position:absolute;top:0;left:0;width:100%;height:100%;
  display:flex;justify-content:center;align-items:flex-start;
  pointer-events:none;z-index:5;
  transform-origin:center center;
  will-change:transform;
}
.arrow-pointer{
  width:0;height:0;
  border-left:12px solid transparent;
  border-right:12px solid transparent;
  border-top:28px solid var(--accent);
  margin-top:18px;position:relative;
  filter:drop-shadow(0 0 8px var(--accent));
}
.arrow-pointer::after{
  content:'';position:absolute;top:-34px;left:-5px;
  width:10px;height:10px;
  background:var(--accent-bright);border-radius:50%;
  animation:pointerPulse 1s ease-in-out infinite;
  box-shadow:0 0 12px var(--accent-bright);
}
@keyframes pointerPulse{
  0%,100%{transform:scale(1);opacity:.8}
  50%{transform:scale(1.4);opacity:1}
}
.progress-center{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  text-align:center;z-index:10;
}
.chance-big{
  font-family:var(--font-display);font-size:44px;font-weight:900;
  background:linear-gradient(135deg,var(--green-bright),var(--accent-bright));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;line-height:1;
  filter:drop-shadow(0 0 20px rgba(245,197,66,.4));
}
.chance-label{
  font-size:12px;color:var(--accent-bright);font-weight:900;
  text-transform:uppercase;letter-spacing:4px;
  margin-top:6px;min-height:16px;
}
.chance-label.hidden{visibility:hidden}

.items-row{
  display:flex;justify-content:center;align-items:center;
  gap:14px;padding:16px 24px;
}
.item-box{
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border-radius:var(--radius-md);
  padding:18px;
  display:flex;flex-direction:column;align-items:center;
  border:1px solid var(--border-default);
  min-width:150px;flex:1;max-width:200px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),var(--shadow-sm);
}
.item-box .label{
  font-size:10px;color:var(--text-secondary);
  font-weight:900;text-transform:uppercase;letter-spacing:2px;
  margin-bottom:10px;
}
.item-box img{width:64px;height:64px;object-fit:contain;margin-bottom:8px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
.item-box .name{
  font-size:11px;font-weight:800;text-align:center;
  margin-bottom:6px;color:#fff;height:30px;
  display:flex;align-items:center;justify-content:center;
}
.item-box .price{
  font-family:var(--font-display);font-size:12px;font-weight:900;
  color:var(--accent-bright);
  display:flex;align-items:center;gap:4px;margin-bottom:6px;
}
.price-coin{width:14px;height:14px;object-fit:contain}
.swap-arrow{
  font-size:26px;color:var(--accent);
  filter:drop-shadow(0 0 8px var(--accent));
}

.stage-controls{
  display:flex;justify-content:center;align-items:center;
  gap:10px;padding:0 24px 8px;
}
.upgrade-main-btn{
  flex:0 1 240px;padding:16px 22px;
  border-radius:var(--radius-md);
  border:1px solid var(--border-default);
  background:linear-gradient(135deg,var(--green),var(--accent));
  color:#0a1a0f;
  font-family:var(--font-display);font-size:13px;font-weight:900;
  text-transform:uppercase;letter-spacing:2px;
  cursor:pointer;
  transition:all .3s var(--ease-out);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(46,204,113,.25),inset 0 1px 0 rgba(255,255,255,.25);
  position:relative;overflow:hidden;
}
.upgrade-main-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.3) 50%,transparent 70%);
  transform:translateX(-100%);transition:transform .7s;
}
.upgrade-main-btn:hover:not(:disabled){
  filter:brightness(1.1);transform:translateY(-2px);
  box-shadow:0 8px 30px rgba(46,204,113,.4),inset 0 1px 0 rgba(255,255,255,.25);
}
.upgrade-main-btn:hover:not(:disabled)::before{transform:translateX(100%)}
.upgrade-main-btn:disabled{opacity:.4;cursor:not-allowed;background:#3a3d4d;box-shadow:none}

.fast-btn{
  width:50px;height:50px;border-radius:var(--radius-md);
  border:1px solid var(--border-default);
  background:rgba(255,255,255,.05);
  color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .25s var(--ease-out);
}
.fast-btn:hover{transform:translateY(-2px);border-color:var(--accent)}
.fast-btn.active{
  background:linear-gradient(135deg,var(--green),var(--accent));
  border-color:var(--accent-bright);
  box-shadow:0 0 24px rgba(245,197,66,.4),inset 0 1px 0 rgba(255,255,255,.25);
}
.fast-btn svg{width:22px;height:22px}

.choose-target-simple{display:flex;align-items:center;justify-content:center;margin-top:8px}
.choose-target-simple .plus-btn{
  width:44px;height:44px;border:none;
  background:transparent;color:#fff;
  font-family:var(--font-display);font-size:34px;font-weight:300;
  line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .25s var(--ease-out);padding:0;
}
.choose-target-simple .plus-btn:hover:not(:disabled){
  color:var(--accent-bright);transform:scale(1.15) rotate(90deg);
  filter:drop-shadow(0 0 8px var(--accent-bright));
}
.choose-target-simple .plus-btn:disabled{opacity:.2;cursor:not-allowed}

.section-title{
  font-family:var(--font-display);font-size:13px;font-weight:900;
  color:var(--accent-bright);text-transform:uppercase;letter-spacing:2px;
  margin-bottom:12px;padding:0 24px;
  display:flex;align-items:center;gap:10px;
}
.section-title::before{
  content:'';width:4px;height:16px;
  background:linear-gradient(180deg,var(--green),var(--accent));
  border-radius:2px;
  box-shadow:0 0 8px rgba(245,197,66,.5);
}
.section-block{margin-top:24px}

/* ---------- INVENTORY ---------- */
.inventory-row{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
  gap:10px;padding:4px 24px 14px;
}
.shop-scroll{
  max-height:480px;overflow-y:auto;
  padding:4px 24px 14px;
  scrollbar-width:thin;scrollbar-color:var(--accent-dim) transparent;
}
.shop-scroll::-webkit-scrollbar{width:6px}
.shop-scroll::-webkit-scrollbar-track{background:transparent}
.shop-scroll::-webkit-scrollbar-thumb{background:var(--accent-dim);border-radius:3px}
.shop-scroll::-webkit-scrollbar-thumb:hover{background:var(--accent)}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}

.inv-card,.shop-card{
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
  border-radius:var(--radius-md);
  padding:12px 8px;
  display:flex;flex-direction:column;align-items:center;
  border:1px solid var(--border-default);
  transition:all .3s var(--ease-out);
  position:relative;min-width:0;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}
.inv-card:hover,.shop-card:hover{
  border-color:var(--accent);
  background:var(--accent-very-dim);
  transform:translateY(-3px);
  box-shadow:0 8px 24px rgba(0,0,0,.4),0 0 24px rgba(245,197,66,.2);
}
.inv-card.selected{
  border-color:var(--accent);
  background:var(--accent-very-dim);
  box-shadow:0 0 24px rgba(245,197,66,.3),inset 0 1px 0 rgba(255,255,255,.1);
}
.inv-card img,.shop-card img{
  width:100%;max-width:var(--card-img-size);height:var(--card-img-size);
  object-fit:contain;margin-bottom:6px;pointer-events:none;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.5));
}
.inv-card .name,.shop-card .name{
  font-size:var(--card-name-size);font-weight:800;
  text-align:center;margin-bottom:4px;height:24px;
  overflow:hidden;color:#fff;pointer-events:none;line-height:1.15;
  width:100%;display:flex;align-items:center;justify-content:center;
}
.inv-card .price,.shop-card .price{
  font-size:10px;color:var(--accent-bright);font-weight:900;
  display:flex;align-items:center;gap:3px;
  font-family:var(--font-display);pointer-events:none;
}

.buy-btn{
  width:100%;padding:8px;
  border-radius:8px;
  border:1px solid var(--border-default);
  background:linear-gradient(135deg,var(--green),var(--accent));
  color:#0a1a0f;font-weight:900;font-size:9px;
  cursor:pointer;
  transition:filter .2s,transform .2s;
  text-transform:uppercase;font-family:var(--font-display);
  margin-top:6px;position:relative;z-index:5;letter-spacing:.5px;
  box-shadow:0 2px 8px rgba(0,0,0,.3);
}
.buy-btn:hover:not(:disabled){filter:brightness(1.15);transform:translateY(-1px)}
.buy-btn:disabled{opacity:.4;cursor:not-allowed;background:#3a3d4d}

.sell-btn{
  width:100%;padding:8px;
  border-radius:8px;
  border:1px solid var(--green-dim);
  background:var(--accent-very-dim);
  color:var(--green-bright);
  font-weight:900;font-size:9px;cursor:pointer;
  text-transform:uppercase;font-family:var(--font-display);
  margin-top:6px;position:relative;z-index:5;letter-spacing:.5px;
  transition:all .2s;
}
.sell-btn:hover:not(:disabled){background:rgba(245,197,66,.15);border-color:var(--green-bright)}
.sell-btn:disabled{opacity:.4;cursor:not-allowed}

.empty-inv{
  color:var(--text-muted);font-size:12px;
  text-align:center;width:100%;padding:24px;
  font-weight:800;grid-column:1/-1;
}
.selectable{display:flex;flex-direction:column;align-items:center;width:100%;cursor:pointer}
.locked{pointer-events:none !important;opacity:.4 !important;filter:grayscale(.5) !important}

/* ---------- TARGET LIST ---------- */
.target-list{
  display:flex;flex-direction:column;gap:8px;
  max-height:60vh;overflow-y:auto;padding:4px;
}
.target-list-item{
  display:grid;grid-template-columns:48px 1fr auto;
  align-items:center;gap:12px;padding:12px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--border-default);
  border-radius:var(--radius-sm);
  cursor:pointer;
  transition:all .25s var(--ease-out);
}
.target-list-item:hover{
  border-color:var(--accent);
  background:var(--accent-very-dim);
  transform:translateX(4px);
  box-shadow:0 0 20px rgba(245,197,66,.15);
}
.target-list-item img{width:48px;height:48px;object-fit:contain}
.target-list-item .tl-info{min-width:0;text-align:left}
.target-list-item .tl-name{
  font-size:12px;font-weight:800;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-bottom:3px;
}
.target-list-item .tl-price{
  font-family:var(--font-display);font-size:11px;font-weight:900;
  color:var(--accent-bright);display:flex;align-items:center;gap:4px;
}
.target-list-item .tl-price img{width:12px;height:12px}
.target-list-item .tl-chance{
  font-family:var(--font-display);font-size:11px;font-weight:900;
  color:var(--green-bright);text-align:right;
}

/* ============================================================
   RUSH
   ============================================================ */
.rush-page{padding:20px 24px}
.rush-header{text-align:center;margin-bottom:16px}
.rush-title{
  font-family:var(--font-display);font-size:28px;font-weight:900;
  letter-spacing:6px;color:var(--accent-bright);text-transform:uppercase;
  background:linear-gradient(135deg,var(--accent),var(--green-bright),var(--accent));
  background-size:200% 200%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  animation:logoGradient 4s ease infinite;
  filter:drop-shadow(0 0 20px rgba(245,197,66,.4));
}
.rush-subtitle{color:var(--text-secondary);font-size:12px;font-weight:700;margin-top:6px}

.rush-char-row{
  display:flex;align-items:center;gap:14px;
  padding:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border:1px solid var(--border-default);
  border-radius:var(--radius-md);
  margin-bottom:16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),var(--shadow-sm);
}
.rush-char-img{
  width:64px;height:64px;object-fit:contain;
  background:rgba(0,0,0,.4);
  border-radius:var(--radius-sm);padding:4px;
  border:1px solid var(--border-default);
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.5));
}
.rush-char-info{flex:1;min-width:0}
.rush-char-name{
  font-family:var(--font-display);font-size:13px;font-weight:900;
  color:#fff;letter-spacing:1px;margin-bottom:4px;
}
.rush-char-mult{
  font-family:var(--font-display);font-size:11px;font-weight:900;
  color:var(--green-bright);
}
.rush-char-progress{
  font-size:10px;color:var(--text-secondary);
  font-weight:700;margin-top:6px;
}
.rush-char-btn{
  padding:8px 16px;border-radius:8px;
  border:1px solid var(--border-default);
  background:var(--accent-very-dim);
  color:#fff;font-family:var(--font-display);
  font-size:10px;font-weight:900;cursor:pointer;
  text-transform:uppercase;letter-spacing:1px;
  transition:all .2s var(--ease-out);
}
.rush-char-btn:hover{
  background:var(--accent-dim);border-color:var(--accent);
  transform:translateY(-1px);
}

.rush-board-wrap{
  position:relative;margin-bottom:18px;padding:14px;
  background:linear-gradient(180deg,rgba(5,15,8,.7),rgba(5,15,8,.5));
  border:1px solid var(--border-default);
  border-radius:var(--radius-md);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),var(--shadow-md);
}
.rush-board{
  position:relative;display:grid;
  grid-template-columns:repeat(6,1fr);
  grid-template-rows:repeat(5,1fr);
  gap:6px;aspect-ratio:6/5;
}
.rush-cell{
  position:relative;border-radius:8px;border:none;
  background:rgba(255,255,255,.03);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:11px;font-weight:900;
  color:var(--text-secondary);
  transition:background .2s,transform .2s;
}
.rush-cell .rc-num{position:absolute;top:2px;left:4px;font-size:7px;opacity:.45}
.rush-cell.x2{color:#58d68d;background:rgba(46,204,113,.15)}
.rush-cell.x4{color:#ffe066;background:rgba(245,197,66,.22);box-shadow:inset 0 0 12px rgba(245,197,66,.15)}
.rush-cell.x1{color:#e5e7ef}
.rush-cell.x07,.rush-cell.x05{color:#fb923c;background:rgba(251,146,60,.12)}
.rush-cell.x01{color:#ff6b6b;background:rgba(255,107,107,.12)}
.rush-cell.crash{
  color:#fff;
  background:linear-gradient(135deg,rgba(239,68,68,.55),rgba(153,27,27,.55));
  font-size:16px;
  box-shadow:inset 0 0 20px rgba(239,68,68,.3);
}
.rush-piece{
  position:absolute;display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:10;
  transition:left .25s var(--ease-out),top .25s var(--ease-out);
  will-change:left,top;
}
.rush-piece img{
  max-width:80%;max-height:80%;object-fit:contain;
  filter:drop-shadow(0 0 12px var(--accent));
}

.rush-dice-row{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.rush-dice-wrap{perspective:600px;width:64px;height:64px;flex-shrink:0}
.rush-dice{
  width:64px;height:64px;position:relative;
  transform-style:preserve-3d;
  transition:transform .15s linear;
}
.rush-dice.rolling{animation:diceTumble .7s linear infinite}
@keyframes diceTumble{
  0%{transform:rotateX(0) rotateY(0) rotateZ(0)}
  100%{transform:rotateX(360deg) rotateY(720deg) rotateZ(360deg)}
}
.dice-face{
  position:absolute;width:64px;height:64px;
  background:linear-gradient(145deg,#f8fafc,#d1d5db);
  border-radius:8px;border:1px solid #94a3b8;
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  padding:6px;
  box-shadow:inset 0 0 8px rgba(0,0,0,.15);
}
.dice-face .pip{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.dice-face .pip::before{content:'';width:8px;height:8px;border-radius:50%;background:#0f172a}
.face-front {transform: translateZ(32px)}
.face-back  {transform: rotateY(180deg) translateZ(32px)}
.face-right {transform: rotateY(90deg) translateZ(32px)}
.face-left  {transform: rotateY(-90deg) translateZ(32px)}
.face-top   {transform: rotateX(90deg) translateZ(32px)}
.face-bottom{transform: rotateX(-90deg) translateZ(32px)}
.face-1 .pip:nth-child(5)::before{content:''}
.face-1 .pip:not(:nth-child(5))::before{display:none}
.face-2 .pip:nth-child(1)::before,.face-2 .pip:nth-child(9)::before{content:''}
.face-2 .pip:not(:nth-child(1)):not(:nth-child(9))::before{display:none}
.face-3 .pip:nth-child(1)::before,.face-3 .pip:nth-child(5)::before,.face-3 .pip:nth-child(9)::before{content:''}
.face-3 .pip:not(:nth-child(1)):not(:nth-child(5)):not(:nth-child(9))::before{display:none}
.face-4 .pip:nth-child(1)::before,.face-4 .pip:nth-child(3)::before,.face-4 .pip:nth-child(7)::before,.face-4 .pip:nth-child(9)::before{content:''}
.face-4 .pip:not(:nth-child(1)):not(:nth-child(3)):not(:nth-child(7)):not(:nth-child(9))::before{display:none}
.face-5 .pip:nth-child(1)::before,.face-5 .pip:nth-child(3)::before,.face-5 .pip:nth-child(5)::before,.face-5 .pip:nth-child(7)::before,.face-5 .pip:nth-child(9)::before{content:''}
.face-5 .pip:not(:nth-child(1)):not(:nth-child(3)):not(:nth-child(5)):not(:nth-child(7)):not(:nth-child(9))::before{display:none}
.face-6 .pip:nth-child(1)::before,.face-6 .pip:nth-child(3)::before,.face-6 .pip:nth-child(4)::before,.face-6 .pip:nth-child(6)::before,.face-6 .pip:nth-child(7)::before,.face-6 .pip:nth-child(9)::before{content:''}
.face-6 .pip:not(:nth-child(1)):not(:nth-child(3)):not(:nth-child(4)):not(:nth-child(6)):not(:nth-child(7)):not(:nth-child(9))::before{display:none}

.rush-dice-result{
  font-family:var(--font-display);font-size:24px;font-weight:900;
  color:var(--accent-bright);
  filter:drop-shadow(0 0 12px rgba(245,197,66,.5));
}
.rush-bet-wrap{flex:1;display:flex;gap:6px}
.rush-bet-input{
  flex:1;height:64px;padding:0 16px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border-default);
  background:rgba(255,255,255,.04);
  color:#fff;font-family:var(--font-display);
  font-weight:900;font-size:16px;text-align:center;outline:none;
  transition:all .25s;
}
.rush-bet-input:focus{border-color:var(--accent);background:var(--accent-very-dim);box-shadow:0 0 0 3px rgba(245,197,66,.15)}
.rush-quick-bets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.rush-quick-bet{
  height:42px;border-radius:var(--radius-sm);
  border:1px solid var(--border-default);
  background:rgba(255,255,255,.04);
  color:var(--text-secondary);
  font-family:var(--font-display);font-size:12px;font-weight:900;
  cursor:pointer;transition:all .2s var(--ease-out);
}
.rush-quick-bet:hover{
  border-color:var(--accent);color:var(--accent-bright);
  background:var(--accent-very-dim);
  transform:translateY(-1px);
}
.rush-action-btn{
  width:100%;padding:18px;
  border-radius:var(--radius-md);
  border:1px solid var(--border-default);
  background:linear-gradient(135deg,var(--green),var(--accent));
  color:#0a1a0f;
  font-family:var(--font-display);font-size:16px;font-weight:900;
  letter-spacing:3px;text-transform:uppercase;
  cursor:pointer;transition:all .3s var(--ease-out);
  box-shadow:0 4px 24px rgba(46,204,113,.3),inset 0 1px 0 rgba(255,255,255,.25);
  position:relative;overflow:hidden;
}
.rush-action-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.3) 50%,transparent 70%);
  transform:translateX(-100%);transition:transform .7s;
}
.rush-action-btn:hover:not(:disabled){
  filter:brightness(1.15);transform:translateY(-2px);
  box-shadow:0 8px 36px rgba(46,204,113,.5),inset 0 1px 0 rgba(255,255,255,.25);
}
.rush-action-btn:hover:not(:disabled)::before{transform:translateX(100%)}
.rush-action-btn:disabled{opacity:.4;cursor:not-allowed;background:#3a3d4d;box-shadow:none}
.rush-action-btn.cashout{background:linear-gradient(135deg,var(--accent-bright),var(--amber));box-shadow:0 4px 24px rgba(245,197,66,.35),inset 0 1px 0 rgba(255,255,255,.3)}

.rush-anim{
  position:fixed;inset:0;z-index:9999;
  display:none;align-items:center;justify-content:center;flex-direction:column;
  background:rgba(0,0,0,.88);
  backdrop-filter:blur(8px);
  overflow:hidden;
}
.rush-anim.show{display:flex;animation:animFadeIn .35s var(--ease-out)}
@keyframes animFadeIn{from{opacity:0}to{opacity:1}}
.rush-anim-text{
  font-family:var(--font-display);font-size:24px;font-weight:900;
  letter-spacing:6px;color:var(--accent-bright);
  margin-top:20px;z-index:2;
  text-shadow:0 0 20px rgba(245,197,66,.5);
}

.rush-result-card{
  background:linear-gradient(180deg,rgba(15,30,20,.98),rgba(8,20,12,.98)) !important;
  border:1px solid var(--accent) !important;
  padding:30px 26px !important;
  border-radius:var(--radius-lg) !important;
  box-shadow:var(--shadow-xl) !important;
}
.rush-result-label{
  font-family:var(--font-display);font-size:13px;font-weight:900;
  color:var(--accent-bright);letter-spacing:3px;
  text-transform:uppercase;margin-bottom:16px;
}
.rush-result-name{
  font-family:var(--font-display);font-size:15px;font-weight:900;
  color:#fff;margin-bottom:8px;
}
.rush-result-mult{
  font-family:var(--font-display);font-size:24px;font-weight:900;
  color:var(--green-bright);margin-bottom:18px;
  filter:drop-shadow(0 0 12px rgba(88,214,141,.4));
}
.rush-result-stats{
  padding:14px;
  background:rgba(0,0,0,.45);
  border:1px solid var(--border-default);
  border-radius:var(--radius-sm);
  display:flex;flex-direction:column;gap:8px;
}
.rush-result-stats > div{
  display:flex;justify-content:space-between;
  font-family:var(--font-display);font-size:12px;font-weight:900;
  color:var(--text-secondary);letter-spacing:1px;text-transform:uppercase;
}
.rush-result-stats > div > span{color:var(--accent-bright)}

.rush-char-pick{
  display:flex;flex-direction:column;gap:8px;
  max-height:60vh;overflow-y:auto;padding:4px;
}
.rush-char-item{
  display:grid;grid-template-columns:52px 1fr auto;
  align-items:center;gap:12px;padding:12px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--border-default);
  border-radius:var(--radius-md);
  cursor:pointer;transition:all .25s var(--ease-out);
}
.rush-char-item:hover{
  border-color:var(--accent);
  background:var(--accent-very-dim);
  transform:translateX(3px);
}
.rush-char-item.locked{opacity:.5;cursor:not-allowed}
.rush-char-item.selected{
  border-color:var(--accent-bright);
  background:var(--accent-very-dim);
  box-shadow:0 0 20px var(--accent-dim),inset 0 1px 0 rgba(255,255,255,.1);
}
.rush-char-item img{width:52px;height:52px;object-fit:contain}
.rush-char-item .ci-name{font-size:12px;font-weight:800;color:#fff;margin-bottom:3px;text-align:left}
.rush-char-item .ci-mult{font-family:var(--font-display);font-size:10px;font-weight:900;color:var(--green-bright);text-align:left}
.rush-char-item .ci-lock{font-family:var(--font-display);font-size:10px;font-weight:900;color:#ff6b6b;text-align:right}

/* ============================================================
   ADMIN / PROMO
   ============================================================ */
.admin-header{
  background:linear-gradient(135deg,rgba(46,204,113,.18),rgba(245,197,66,.18));
  border:1px solid var(--border-default);
  border-radius:var(--radius-md);
  padding:16px;margin-bottom:16px;
  display:flex;align-items:center;gap:14px;
  position:relative;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1);
}
.admin-header::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.08) 50%,transparent 70%);
  animation:adminShine 3s ease-in-out infinite;
}
@keyframes adminShine{
  0%,100%{transform:translateX(-100%)}
  50%{transform:translateX(100%)}
}
.admin-header-icon{
  width:46px;height:46px;border-radius:var(--radius-sm);
  background:linear-gradient(135deg,var(--green),var(--accent));
  display:flex;align-items:center;justify-content:center;
  color:#0a1a0f;flex-shrink:0;z-index:1;
  box-shadow:0 4px 16px rgba(46,204,113,.3),inset 0 1px 0 rgba(255,255,255,.3);
}
.admin-header-icon svg{width:24px;height:24px}
.admin-header-text{z-index:1;flex:1}
.admin-header-title{
  font-family:var(--font-display);font-size:14px;font-weight:900;
  color:#fff;letter-spacing:2.5px;text-transform:uppercase;
  margin-bottom:3px;
}
.admin-header-sub{
  font-size:10px;color:var(--text-secondary);
  font-weight:700;letter-spacing:.5px;
  display:flex;align-items:center;gap:6px;
}
.admin-online-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--emerald);
  animation:onlinePulse 1.5s ease-in-out infinite;
  box-shadow:0 0 8px var(--emerald);
}

.admin-section{
  background:rgba(255,255,255,.03);
  border:1px solid var(--border-default);
  border-radius:var(--radius-md);
  padding:16px 14px;margin-bottom:14px;
}
.admin-section-title{
  font-family:var(--font-display);font-size:11px;font-weight:900;
  color:var(--accent-bright);letter-spacing:2px;
  text-transform:uppercase;margin-bottom:14px;
  display:flex;align-items:center;gap:8px;
}
.admin-section-title::before{
  content:'';width:3px;height:14px;
  background:linear-gradient(180deg,var(--green),var(--accent));
  border-radius:1px;
  box-shadow:0 0 8px rgba(245,197,66,.4);
}
.admin-preview{
  background:rgba(0,0,0,.35);
  border:1px dashed var(--accent);
  border-radius:8px;padding:10px 14px;margin-bottom:14px;
  display:flex;align-items:center;gap:10px;
}
.admin-preview-label{
  font-size:9px;color:var(--text-secondary);
  font-weight:800;text-transform:uppercase;letter-spacing:1.5px;
  flex-shrink:0;
}
.admin-preview-value{
  font-family:var(--font-display);font-size:13px;font-weight:900;
  color:var(--accent-bright);letter-spacing:2px;
  flex:1;word-break:break-all;
}
.admin-preview-value:empty::after{content:'----';color:var(--text-disabled)}

.admin-grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:8px;max-height:240px;overflow-y:auto;
  padding:8px;margin-bottom:14px;
  background:rgba(0,0,0,.25);
  border-radius:10px;
  border:1px solid rgba(255,255,255,.04);
}
.admin-item{
  background:rgba(255,255,255,.04);
  border:1px solid var(--border-default);
  border-radius:8px;padding:8px 4px;
  display:flex;flex-direction:column;align-items:center;
  cursor:pointer;transition:all .2s var(--ease-out);
  position:relative;
}
.admin-item:hover{border-color:var(--accent);transform:translateY(-1px)}
.admin-item.selected{
  border-color:var(--accent);
  background:var(--accent-very-dim);
  box-shadow:0 0 16px rgba(245,197,66,.2);
}
.admin-item.selected::after{
  content:'✓';
  position:absolute;top:3px;right:3px;
  width:14px;height:14px;border-radius:50%;
  background:linear-gradient(135deg,var(--green),var(--accent));
  color:#0a1a0f;font-size:9px;font-weight:900;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 8px rgba(46,204,113,.5);
}
.admin-item img{width:36px;height:36px;object-fit:contain;margin-bottom:4px}
.admin-item .name{
  font-size:8px;color:#e5e7ef;font-weight:800;
  text-align:center;line-height:1.2;height:20px;overflow:hidden;
}

/* ---------- PROMO LIST ---------- */
.promo-list{margin-top:8px;max-height:300px;overflow-y:auto;text-align:left;padding-right:4px}
.promo-list-item{
  display:grid;grid-template-columns:40px 1fr auto;
  align-items:center;gap:10px;padding:10px 12px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--border-default);
  border-radius:var(--radius-sm);
  margin-bottom:6px;
  transition:all .2s var(--ease-out);
}
.promo-list-item:hover{background:rgba(255,255,255,.06);transform:translateX(2px)}
.promo-list-item .pl-icon{
  width:40px;height:40px;border-radius:8px;
  background:rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.promo-list-item .pl-icon img{width:32px;height:32px;object-fit:contain}
.promo-list-item .pl-icon .pl-coin-icon{width:24px;height:24px}
.promo-list-item .pl-info{min-width:0}
.promo-list-item .code{
  font-family:var(--font-display);font-weight:900;
  color:var(--accent-bright);letter-spacing:1.5px;
  font-size:13px;margin-bottom:3px;
}
.promo-list-item .pl-reward{color:var(--text-secondary);font-size:10px;font-weight:700}
.promo-list-item .pl-uses{
  font-family:var(--font-display);font-weight:900;
  color:var(--green-bright);font-size:12px;
  text-align:right;min-width:50px;
}
.promo-list-item .pl-uses.empty{color:#ff6b6b}
.promo-list-item .pl-uses-label{
  font-size:8px;color:var(--text-secondary);
  font-weight:700;text-align:right;letter-spacing:.5px;
  text-transform:uppercase;margin-top:2px;
}

/* ---------- DEPOSITS ---------- */
.deposits-block{
  margin-top:16px;padding:16px;
  background:rgba(255,200,0,.08);
  border:1px solid rgba(255,200,0,.32);
  border-radius:var(--radius-md);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
}
.deposits-block-title{
  font-family:var(--font-display);font-size:12px;font-weight:900;
  color:#ffcc33;letter-spacing:2px;text-transform:uppercase;
  margin-bottom:14px;
  display:flex;align-items:center;gap:8px;
}
.deposits-block-title::before{
  content:'';width:3px;height:14px;
  background:#ffcc33;border-radius:1px;
  box-shadow:0 0 8px rgba(255,204,51,.5);
}
.deposits-count{
  font-family:var(--font-display);font-size:11px;
  color:#ffcc33;margin-left:auto;font-weight:900;
  background:rgba(255,200,0,.18);
  padding:3px 10px;border-radius:6px;
  border:1px solid rgba(255,200,0,.4);
}
.deposit-item{
  display:grid;grid-template-columns:48px 1fr auto;
  gap:12px;align-items:center;
  padding:12px 14px;
  background:rgba(0,0,0,.35);
  border:1px solid rgba(255,200,0,.28);
  border-radius:var(--radius-sm);
  margin-bottom:8px;
}
.deposit-item img{width:42px;height:42px;object-fit:contain}
.deposit-info{min-width:0;font-size:11px;line-height:1.6;color:#e5e7ef;font-weight:700}
.deposit-info .dep-line{display:flex;gap:5px;align-items:center;word-break:break-word}
.deposit-info .dep-key{color:var(--text-secondary);font-size:10px;font-weight:800}
.deposit-info .dep-val{color:#fff;font-weight:800}
.deposit-info .dep-val.accent{color:var(--accent-bright)}
.deposit-info .dep-val.green{color:var(--green-bright)}

.deposit-actions{display:flex;flex-direction:column;gap:5px;min-width:90px}
.dep-accept,.dep-reject{
  height:30px;padding:0 12px;border-radius:8px;border:none;
  font-family:var(--font-display);font-size:9px;font-weight:900;
  letter-spacing:.5px;cursor:pointer;transition:filter .2s,transform .2s;
  text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:4px;
}
.dep-accept{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;box-shadow:0 2px 8px rgba(34,197,94,.3)}
.dep-accept:hover{filter:brightness(1.15);transform:translateY(-1px)}
.dep-reject{
  background:rgba(239,68,68,.2);
  color:#f87171;
  border:1px solid rgba(239,68,68,.5);
}
.dep-reject:hover{background:#ef4444;color:#fff;transform:translateY(-1px)}
.deposits-empty{text-align:center;color:var(--text-muted);font-size:11px;padding:14px;font-weight:700}

/* ---------- TOPUP GRID ---------- */
.topup-grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:8px;max-height:260px;overflow-y:auto;
  padding:8px;background:rgba(0,0,0,.25);
  border-radius:10px;margin-bottom:12px;
  border:1px solid rgba(255,255,255,.05);
}
.topup-item{
  padding:8px 4px;
  border:1px solid var(--border-default);
  border-radius:8px;background:rgba(255,255,255,.03);
  display:flex;flex-direction:column;align-items:center;gap:4px;
  cursor:pointer;transition:all .2s var(--ease-out);text-align:center;
}
.topup-item:hover{border-color:var(--accent);transform:translateY(-1px)}
.topup-item.selected{
  border-color:var(--accent);
  background:var(--accent-very-dim);
  box-shadow:0 0 16px rgba(245,197,66,.2);
}
.topup-item img{width:36px;height:36px;object-fit:contain}
.topup-item .ti-name{font-size:8px;color:#e5e7ef;font-weight:800;line-height:1.1;height:20px;overflow:hidden}
.topup-item .ti-price{font-family:var(--font-display);font-size:9px;color:var(--accent-bright);font-weight:900}

.topup-price-line{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px;background:rgba(255,255,255,.03);
  border:1px solid var(--border-default);
  border-radius:10px;margin-bottom:10px;font-size:12px;
}
.topup-price-line .tpl-label{color:var(--text-secondary);font-weight:800}
.topup-price-line .tpl-value{
  font-family:var(--font-display);font-weight:900;color:#fff;
  display:flex;align-items:center;gap:5px;
}
.topup-price-line .tpl-value img{width:13px;height:13px}

/* ============================================================
   PROFILE
   ============================================================ */
.profile-page{padding:20px 24px}
.profile-banner{
  position:relative;width:100%;height:240px;
  border-radius:var(--radius-lg);overflow:hidden;
  margin-bottom:18px;
  border:1px solid var(--border-default);
  background:linear-gradient(135deg,rgba(10,26,15,.85),rgba(26,58,31,.85));
  box-shadow:var(--shadow-md);
}
.profile-banner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.profile-banner-overlay{
  position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.85) 100%);
  pointer-events:none;
}
.profile-banner-content{
  position:absolute;bottom:16px;left:22px;right:22px;
  display:flex;align-items:flex-end;gap:18px;z-index:3;
}
.avatar-orbit-wrapper{position:relative;width:110px;height:110px;flex-shrink:0}
.profile-avatar-big{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:88px;height:88px;border-radius:50%;
  object-fit:cover;
  border:3px solid var(--accent);
  background:#0a1a0f;z-index:5;
  box-shadow:0 0 32px rgba(245,197,66,.5),0 8px 24px rgba(0,0,0,.6);
}
.avatar-orbit{position:absolute;inset:0;pointer-events:none;z-index:4}
.avatar-orbit-item{
  position:absolute;top:50%;left:50%;
  width:26px;height:26px;margin-left:-13px;margin-top:-13px;
  border-radius:50%;
  background:var(--glass-bg-strong);
  border:1px solid var(--accent);
  display:flex;align-items:center;justify-content:center;
  animation:orbitSpin linear infinite;
  transform-origin:13px 13px;
  will-change:transform;
  box-shadow:0 0 12px rgba(245,197,66,.4);
}
.avatar-orbit-item img{width:18px;height:18px;object-fit:contain}
@keyframes orbitSpin{
  from{transform:rotate(0deg) translateX(55px) rotate(0deg)}
  to{transform:rotate(360deg) translateX(55px) rotate(-360deg)}
}
.profile-nick-big{
  font-family:var(--font-display);font-size:24px;font-weight:900;
  color:#fff;letter-spacing:1.5px;
  text-shadow:0 2px 12px rgba(0,0,0,.8);
}
.profile-tg-big{
  font-size:14px;color:var(--accent-bright);font-weight:800;
  text-decoration:none;letter-spacing:.5px;
  transition:color .2s;
}
.profile-tg-big:hover{color:#fff}

.profile-stats-column{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.profile-stat{
  padding:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border:1px solid var(--border-default);
  border-radius:var(--radius-md);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
}
.profile-stat-label{
  font-size:10px;color:var(--text-secondary);
  font-weight:800;letter-spacing:2px;text-transform:uppercase;
  margin-bottom:6px;
}
.profile-stat-value{
  font-family:var(--font-display);font-size:24px;font-weight:900;
  color:#fff;display:flex;align-items:center;gap:8px;
}
.profile-stat-value img{width:20px;height:20px;filter:drop-shadow(0 0 6px rgba(245,197,66,.5))}
.profile-stat.expandable{cursor:pointer;transition:all .25s var(--ease-out)}
.profile-stat.expandable:hover{background:var(--accent-very-dim);border-color:var(--accent);transform:translateY(-1px)}
.profile-stat-value .expand-arrow{
  margin-left:auto;width:18px;height:18px;
  transition:transform .3s var(--ease-out);
  color:var(--accent-bright);
}
.profile-stat.expanded .expand-arrow{transform:rotate(180deg)}

.profile-inventory-drawer{
  max-height:0;overflow:hidden;
  transition:max-height .5s var(--ease-out),padding .4s var(--ease-out),margin-top .4s var(--ease-out);
  background:rgba(0,0,0,.25);
  border-radius:10px;margin-top:0;
}
.profile-inventory-drawer.expanded{
  max-height:500px;padding:12px;margin-top:10px;
  border:1px solid var(--border-default);
}
.profile-inventory-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.profile-inventory-item{
  background:rgba(255,255,255,.04);
  border:1px solid var(--border-default);
  border-radius:10px;padding:10px 6px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
}
.profile-inventory-item img{width:52px;height:52px;object-fit:contain}
.profile-inventory-item .inv-name{
  font-size:9px;color:#e5e7ef;font-weight:800;
  text-align:center;line-height:1.1;height:20px;overflow:hidden;
}
.profile-inventory-item .inv-price{
  font-family:var(--font-display);font-size:10px;
  color:var(--accent-bright);font-weight:900;
}
.profile-inventory-empty{
  text-align:center;color:var(--text-muted);
  font-size:11px;padding:20px;font-weight:700;
}

.menu-page{padding:20px 24px;display:flex;flex-direction:column;gap:16px}
.menu-section-title{
  font-family:var(--font-display);font-size:20px;font-weight:900;
  color:#fff;letter-spacing:4px;text-transform:uppercase;
  text-align:center;padding:12px 0 8px;
  text-shadow:0 0 20px rgba(245,197,66,.3);
}

/* ---------- CUSTOMIZE ---------- */
.customize-in-profile{margin-top:18px}
.customize-section{
  padding:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
  border:1px solid var(--border-default);
  border-radius:var(--radius-md);margin-bottom:12px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
}
.customize-section-title{
  font-family:var(--font-display);font-size:11px;
  color:var(--accent-bright);font-weight:900;
  letter-spacing:2px;text-transform:uppercase;
  margin-bottom:12px;
  display:flex;align-items:center;gap:10px;
}
.customize-section-title::before{
  content:'';width:3px;height:14px;
  background:linear-gradient(180deg,var(--green),var(--accent));
  border-radius:1px;
  box-shadow:0 0 8px rgba(245,197,66,.4);
}

.slider-row{display:flex;align-items:center;gap:12px}
.slider-row input[type="range"]{
  flex:1;-webkit-appearance:none;appearance:none;
  height:8px;background:rgba(255,255,255,.08);
  border-radius:4px;outline:none;
}
.slider-row input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:24px;height:24px;border-radius:8px;
  background:linear-gradient(135deg,var(--green),var(--accent));
  cursor:pointer;
  box-shadow:0 0 12px rgba(245,197,66,.4),inset 0 1px 0 rgba(255,255,255,.3);
}
.slider-row input[type="range"]::-moz-range-thumb{
  width:24px;height:24px;border-radius:8px;
  background:linear-gradient(135deg,var(--green),var(--accent));
  cursor:pointer;border:none;
  box-shadow:0 0 12px rgba(245,197,66,.4);
}
.slider-value{
  font-family:var(--font-display);font-weight:900;
  font-size:13px;color:#fff;min-width:50px;text-align:right;
}

.bg-options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bg-option{
  aspect-ratio:1/.7;border-radius:10px;
  border:1px solid var(--border-default);
  background:rgba(10,26,15,.65);
  cursor:pointer;overflow:hidden;position:relative;
  transition:all .25s var(--ease-out);
}
.bg-option:hover{border-color:var(--accent);transform:translateY(-2px)}
.bg-option.selected{border-color:var(--accent);box-shadow:0 0 16px rgba(245,197,66,.3)}
.bg-option video{width:100%;height:100%;object-fit:cover}
.bg-option .bg-placeholder{
  width:100%;height:100%;
  background:linear-gradient(135deg,rgba(10,26,15,.85),rgba(26,58,31,.85));
  display:flex;align-items:center;justify-content:center;
  color:var(--text-secondary);font-family:var(--font-display);
  font-size:10px;text-align:center;padding:6px;font-weight:800;
}
.bg-option.selected::after{
  content:'OK';
  position:absolute;top:4px;right:4px;
  width:22px;height:22px;border-radius:6px;
  background:linear-gradient(135deg,var(--green),var(--accent));
  color:#0a1a0f;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:900;
}

.orbit-picker{
  display:flex;flex-wrap:wrap;gap:6px;
  max-height:200px;overflow-y:auto;
  padding:6px;border-radius:10px;
  background:rgba(0,0,0,.25);
}
.orbit-item{
  width:50px;height:50px;border-radius:10px;
  border:1px solid var(--border-default);
  background:rgba(255,255,255,.03);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s var(--ease-out);
  position:relative;
}
