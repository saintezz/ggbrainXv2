.orbit-item:hover{border-color:var(--accent);transform:translateY(-1px)}
.orbit-item.selected{
  border-color:var(--accent);
  background:var(--accent-very-dim);
  box-shadow:0 0 16px rgba(245,197,66,.2);
}
.orbit-item.selected::after{
  content:'OK';
  position:absolute;top:-5px;right:-5px;
  width:18px;height:18px;border-radius:6px;
  background:linear-gradient(135deg,var(--green),var(--accent));
  color:#0a1a0f;font-size:8px;font-weight:900;
  display:flex;align-items:center;justify-content:center;
}
.orbit-item img{width:38px;height:38px;object-fit:contain}

.color-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.color-swatch{
  aspect-ratio:1;border-radius:10px;cursor:pointer;
  border:2px solid rgba(255,255,255,.1);
  transition:all .2s var(--ease-out);
  position:relative;
}
.color-swatch:hover{transform:scale(1.1);border-color:rgba(255,255,255,.3)}
.color-swatch.selected{
  border-color:#fff;
  transform:scale(1.06);
  box-shadow:0 0 16px currentColor,0 0 32px currentColor;
}
.color-swatch.selected::after{
  content:'OK';
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:10px;font-weight:900;
  text-shadow:0 0 6px rgba(0,0,0,.9);
}

.weather-options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.weather-option{
  aspect-ratio:1/.7;border-radius:10px;
  border:1px solid var(--border-default);
  background:rgba(255,255,255,.03);
  cursor:pointer;transition:all .25s var(--ease-out);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:8px;position:relative;
}
.weather-option:hover{border-color:var(--accent);transform:translateY(-2px)}
.weather-option.selected{
  border-color:var(--accent);
  background:var(--accent-very-dim);
  box-shadow:0 0 16px rgba(245,197,66,.2);
}
.weather-option img{width:42px;height:42px;object-fit:contain}
.weather-option .wo-label{
  font-family:var(--font-display);font-size:9px;
  font-weight:900;color:#fff;letter-spacing:1px;text-transform:uppercase;
}
.weather-option.selected::after{
  content:'OK';
  position:absolute;top:4px;right:4px;
  width:22px;height:22px;border-radius:6px;
  background:linear-gradient(135deg,var(--green),var(--accent));
  color:#0a1a0f;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:900;
}
.weather-option.none-option{grid-column:span 3;aspect-ratio:auto;padding:12px;flex-direction:row}
.weather-option.none-option .wo-label{font-size:11px}

.avatar-upload-row{display:flex;align-items:center;gap:12px}
.avatar-preview{
  width:70px;height:70px;border-radius:12px;
  border:2px solid var(--accent);
  object-fit:cover;background:#0a1a0f;flex-shrink:0;
  box-shadow:0 0 20px rgba(245,197,66,.4);
}
.upload-btn{
  flex:1;padding:14px 18px;border-radius:10px;
  border:1px solid var(--border-default);
  background:var(--accent-very-dim);
  color:#fff;font-family:var(--font-display);
  font-size:11px;font-weight:900;
  text-transform:uppercase;letter-spacing:1.5px;
  cursor:pointer;transition:all .2s var(--ease-out);
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.upload-btn:hover{
  background:var(--accent-dim);border-color:var(--accent);
  transform:translateY(-1px);
  box-shadow:0 4px 16px rgba(245,197,66,.2);
}
.upload-btn svg{width:18px;height:18px}
.reset-avatar-btn{
  padding:10px 14px;border-radius:10px;
  border:1px solid rgba(255,100,100,.4);
  background:rgba(255,100,100,.12);
  color:#ff8a8a;font-family:var(--font-display);
  font-size:10px;font-weight:900;cursor:pointer;
  transition:all .2s;text-transform:uppercase;
}
.reset-avatar-btn:hover{
  background:rgba(255,100,100,.28);
  transform:translateY(-1px);
}

/* ============================================================
   ROCKET
   ============================================================ */
.rocket-page{padding:20px 24px;max-width:900px;margin:0 auto}
.rocket-header{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:16px;
}
.rocket-title{
  font-family:var(--font-display);font-size:22px;font-weight:900;
  color:#fff;letter-spacing:3px;text-transform:uppercase;
  text-shadow:0 0 20px rgba(245,197,66,.3);
}
.rocket-subtitle{color:var(--text-secondary);font-size:12px;letter-spacing:1px;font-weight:700}
.rocket-balance-inline{
  display:flex;align-items:center;gap:5px;
  font-family:var(--font-display);font-weight:900;font-size:14px;color:#fff;
}
.rocket-balance-inline img{width:18px;height:18px;filter:drop-shadow(0 0 4px rgba(245,197,66,.6))}
.rocket-balance-wrap{
  display:flex;align-items:center;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));
  border:1px solid var(--border-default);
  border-radius:var(--radius-md);overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1);
}
.rocket-balance-wrap .rocket-balance-inline{padding:8px 14px}

.rocket-stage{
  position:relative;width:100%;height:340px;
  background:
    radial-gradient(ellipse at 50% 100%,rgba(46,204,113,.12),transparent 60%),
    linear-gradient(180deg,rgba(5,15,8,.85),rgba(2,8,4,.95));
  border:1px solid var(--border-default);
  border-radius:var(--radius-lg);
  overflow:hidden;margin-bottom:16px;
  box-shadow:inset 0 0 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);
}
.rocket-stars{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.star{
  position:absolute;width:2px;height:2px;
  background:#fff;border-radius:50%;
  animation:starTwinkle 3s ease-in-out infinite;
}
@keyframes starTwinkle{0%,100%{opacity:.2}50%{opacity:.8}}

.rocket-sprite{
  position:absolute;left:40px;bottom:40px;
  width:50px;height:50px;z-index:5;
  transition:left .05s linear,bottom .05s linear;
}
.rocket-sprite img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 12px rgba(245,197,66,.6))}
.rocket-sprite.flying img{animation:rocketShake .15s ease-in-out infinite alternate}
@keyframes rocketShake{
  from{transform:translate(0,0) rotate(-3deg)}
  to{transform:translate(1px,-1px) rotate(3deg)}
}
.rocket-sprite.crashed img{
  filter:brightness(.4) hue-rotate(-40deg) drop-shadow(0 0 20px #ff5555);
  transform:rotate(45deg) scale(1.3);
}
.rocket-sprite.cashed img{filter:brightness(1.2) drop-shadow(0 0 20px var(--green-bright))}

.rocket-x-display{
  position:absolute;top:20px;right:20px;
  font-family:var(--font-display);font-weight:900;font-size:44px;
  color:var(--accent-bright);z-index:6;
  text-shadow:0 0 24px rgba(245,197,66,.6),0 4px 12px rgba(0,0,0,.8);
}
.rocket-x-display.crashed{color:#ff5555;text-shadow:0 0 24px rgba(255,85,85,.6),0 4px 12px rgba(0,0,0,.8)}
.rocket-x-display.cashed{color:var(--green-bright);text-shadow:0 0 24px rgba(88,214,141,.6),0 4px 12px rgba(0,0,0,.8)}

.rocket-multiplier-bar{position:absolute;left:20px;bottom:20px;z-index:6}
.rocket-bar-label{
  font-family:var(--font-display);font-size:9px;color:var(--text-secondary);
  letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;font-weight:800;
}
.rocket-bar-track{
  width:220px;height:6px;
  background:rgba(255,255,255,.08);
  border-radius:3px;overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.5);
}
.rocket-bar-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--green),var(--accent));
  transition:width .05s linear;
  box-shadow:0 0 12px rgba(245,197,66,.5);
}

.rocket-status{
  position:absolute;top:20px;left:20px;
  font-family:var(--font-display);font-size:12px;font-weight:900;
  letter-spacing:2.5px;text-transform:uppercase;
  color:var(--text-secondary);z-index:6;
}
.rocket-status.flying{color:var(--accent-bright);text-shadow:0 0 12px rgba(245,197,66,.5)}
.rocket-status.crashed{color:#ff5555;text-shadow:0 0 12px rgba(255,85,85,.5)}
.rocket-status.cashed{color:var(--green-bright);text-shadow:0 0 12px rgba(88,214,141,.5)}

.rocket-history{
  margin-top:14px;padding:14px;
  background:rgba(255,255,255,.03);
  border:1px solid var(--border-default);
  border-radius:var(--radius-md);
}
.rocket-history-label{
  font-family:var(--font-display);font-size:10px;color:var(--text-secondary);
  letter-spacing:2.5px;text-transform:uppercase;margin-bottom:10px;font-weight:800;
}
.rocket-history-list{display:flex;gap:6px;flex-wrap:wrap;max-height:70px;overflow-y:auto}
.rocket-history-item{
  padding:4px 10px;border-radius:8px;
  font-family:var(--font-display);font-size:10px;font-weight:900;
  background:var(--accent-very-dim);
  border:1px solid var(--border-default);
  color:var(--accent-bright);
}
.rocket-history-item.crashed{
  background:rgba(255,80,80,.15);
  border-color:#ff5555;color:#ff5555;
}
.rocket-history-item.low{color:var(--text-secondary);border-color:rgba(255,255,255,.1)}

.rocket-controls{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rocket-bet-input-wrap{display:flex;gap:6px}
.rocket-bet-input{
  flex:1;height:52px;padding:0 16px;
  border-radius:10px;
  border:1px solid var(--border-default);
  background:rgba(255,255,255,.04);
  color:#fff;font-family:var(--font-display);
  font-weight:900;font-size:15px;text-align:center;outline:none;
  transition:all .25s;
}
.rocket-bet-input:focus{
  border-color:var(--accent);
  background:var(--accent-very-dim);
  box-shadow:0 0 0 3px rgba(245,197,66,.15);
}
.rocket-quick-bets{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.rocket-quick-bet{
  height:52px;border-radius:10px;
  border:1px solid var(--border-default);
  background:rgba(255,255,255,.04);
  color:var(--text-secondary);
  font-family:var(--font-display);font-size:13px;font-weight:900;
  cursor:pointer;transition:all .2s var(--ease-out);
}
.rocket-quick-bet:hover{
  border-color:var(--accent);color:var(--accent-bright);
  background:var(--accent-very-dim);transform:translateY(-1px);
}
.rocket-action-btn{
  grid-column:1/-1;height:64px;
  border-radius:var(--radius-md);
  border:1px solid var(--border-default);
  background:linear-gradient(135deg,var(--green),var(--accent));
  color:#0a1a0f;
  font-family:var(--font-display);font-size:17px;font-weight:900;
  letter-spacing:3px;text-transform:uppercase;
  cursor:pointer;transition:all .3s var(--ease-out);
  box-shadow:0 4px 24px rgba(46,204,113,.3),inset 0 1px 0 rgba(255,255,255,.25);
  position:relative;overflow:hidden;
}
.rocket-action-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.3) 50%,transparent 70%);
  transform:translateX(-100%);transition:transform .7s;
}
.rocket-action-btn:hover:not(:disabled){
  filter:brightness(1.12);transform:translateY(-2px);
  box-shadow:0 8px 36px rgba(46,204,113,.5),inset 0 1px 0 rgba(255,255,255,.25);
}
.rocket-action-btn:hover:not(:disabled)::before{transform:translateX(100%)}
.rocket-action-btn:disabled{opacity:.4;cursor:not-allowed;background:#3a3d4d;box-shadow:none}
.rocket-action-btn.cashout{background:linear-gradient(135deg,var(--green-bright),var(--emerald));color:#0a1a0f}
.rocket-action-btn.crashed{background:#3a3d4d;color:#6b7280}

.rocket-overlay-result{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;
  background:rgba(0,0,0,.8);
  backdrop-filter:blur(8px);
  z-index:20;opacity:0;pointer-events:none;
  transition:opacity .35s var(--ease-out);
}
.rocket-overlay-result.show{opacity:1}
.rocket-result-x{
  font-family:var(--font-display);font-size:68px;font-weight:900;
  letter-spacing:3px;
}
.rocket-result-x.win{color:var(--green-bright);text-shadow:0 0 32px rgba(88,214,141,.6)}
.rocket-result-x.lose{color:#ff5555;text-shadow:0 0 32px rgba(255,85,85,.6)}
.rocket-result-label{
  font-family:var(--font-display);font-size:15px;
  letter-spacing:4px;text-transform:uppercase;color:#fff;font-weight:900;
}
.rocket-result-prize{
  font-family:var(--font-display);font-size:26px;font-weight:900;
  color:var(--accent-bright);
  display:flex;align-items:center;gap:8px;
  text-shadow:0 0 20px rgba(245,197,66,.5);
}
.rocket-result-prize img{width:24px;height:24px}

/* ============================================================
   PROMO PAGE
   ============================================================ */
.promo-panel{padding:32px 24px;text-align:center}
.promo-panel h2{
  font-family:var(--font-display);font-size:22px;font-weight:900;
  color:#fff;margin-bottom:8px;
  text-transform:uppercase;letter-spacing:3px;
  text-shadow:0 0 20px rgba(245,197,66,.3);
}
.promo-panel p{color:var(--text-secondary);font-size:13px;margin-bottom:20px;font-weight:700}
.promo-input-wrap{display:flex;gap:10px;max-width:480px;margin:0 auto}
.promo-input-wrap .form-input{flex:1;text-transform:uppercase}
.promo-input-wrap .action-btn{width:auto;padding:12px 20px;margin-top:0;flex-shrink:0}
.profile-action-row{margin-top:14px}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:900px){
  body{padding:0 0 100px}
  .inventory-row{grid-template-columns:repeat(auto-fill,minmax(82px,1fr));padding:4px 16px 10px}
  .shop-grid{grid-template-columns:repeat(auto-fill,minmax(82px,1fr))}
  .topup-grid{grid-template-columns:repeat(3,1fr)}
  :root{--card-img-size:48px}
  .admin-grid{grid-template-columns:repeat(3,1fr)}
  .top-bar{padding:14px 16px}
  .menu-page,.profile-page,.rush-page,.rocket-page{padding:16px}
  .cases-grid{padding:0 16px}
  .cases-header{padding:14px 16px 8px}
  .section-title{padding:0 16px}
}
@media (max-width:600px){
  .app{border-radius:0;border-left:none;border-right:none}
  .nav-panel{gap:6px;padding:8px 10px;bottom:10px;border-radius:16px}
  .nav-btn{width:44px;height:44px;min-width:44px;min-height:44px;border-radius:12px}
  .nav-btn svg{width:20px;height:20px}
  .nav-btn img{padding:3px}
  .nav-btn-fuse{width:54px;height:54px;min-width:54px;min-height:54px;border-radius:14px}
  .nav-btn-fuse img{width:36px;height:36px}
  .nav-btn-fuse .fuse-label{font-size:6px}
  .progress-wrapper{width:270px;height:270px}
  .chance-big{font-size:38px}
  .item-box{min-width:0;padding:14px;max-width:none}
  .item-box img{width:52px;height:52px}
  .upgrade-main-btn{flex:0 1 200px;font-size:12px;padding:12px}
  .fast-btn{width:46px;height:46px}
  .inventory-row{grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px;padding:4px 12px 10px}
  .shop-grid{grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
  .shop-scroll{padding:4px 12px 10px;max-height:340px}
  .section-title{padding-left:12px;padding-right:12px;font-size:11px}
  .items-row{padding:12px;gap:8px}
  .stage-controls{padding:0 12px 6px}
  .top-bar{padding:12px 14px}
  .balance{padding:8px 10px;font-size:12px}
  .rocket-stage{height:280px}
  .rocket-x-display{font-size:32px;top:14px;right:14px}
  .rocket-sprite{width:42px;height:42px}
  .rocket-bar-track{width:140px}
  .rocket-controls{grid-template-columns:1fr}
  .rocket-bet-input-wrap{grid-column:1/-1}
  .rocket-quick-bets{grid-column:1/-1;grid-template-columns:repeat(4,1fr)}
  .rocket-action-btn{grid-column:1/-1}
  .bg-options{grid-template-columns:repeat(2,1fr)}
  .profile-banner{height:200px}
  .avatar-orbit-wrapper{width:90px;height:90px}
  .profile-avatar-big{width:72px;height:72px}
  .profile-nick-big{font-size:18px}
  .avatar-orbit-item{width:22px;height:22px;margin-left:-11px;margin-top:-11px;transform-origin:11px 11px}
  .avatar-orbit-item img{width:14px;height:14px}
  :root{--card-img-size:44px;--card-name-size:8px;--roulette-item-width:100px}
  .color-grid{grid-template-columns:repeat(5,1fr)}
  .admin-grid{grid-template-columns:repeat(2,1fr)}
  .deposit-item{grid-template-columns:40px 1fr}
  .deposit-actions{grid-column:1/-1;flex-direction:row}
  .dep-accept,.dep-reject{flex:1}
  .rush-title{font-size:20px;letter-spacing:4px}
  .rush-dice-wrap,.rush-dice{width:54px;height:54px}
  .dice-face{width:54px;height:54px}
  .face-front{transform:translateZ(27px)}
  .face-back{transform:rotateY(180deg) translateZ(27px)}
  .face-right{transform:rotateY(90deg) translateZ(27px)}
  .face-left{transform:rotateY(-90deg) translateZ(27px)}
  .face-top{transform:rotateX(90deg) translateZ(27px)}
  .face-bottom{transform:rotateX(-90deg) translateZ(27px)}
  .rush-bet-input{height:54px;font-size:14px}
  .rush-result-mult{font-size:18px}
  .case-card-inner{padding:16px 12px 14px}
  .case-name{font-size:10px}
  .case-price{font-size:12px;padding:6px 12px}
  .case-img-wrap img{width:80%;height:80%}
  .cases-grid{gap:12px;padding:0 12px}
  .case-open-main-img{width:180px;height:180px}
  .case-open-name{font-size:20px;letter-spacing:3px}
  .case-roulette-item img{width:54px;height:54px}
  .case-roulette-row{height:120px}
  .case-roulette-item .roulette-name{font-size:8px;height:18px}
  .case-qty-btn-big{padding:14px 6px;font-size:15px}
  .case-open-action-btn{padding:16px;font-size:14px;letter-spacing:2px}
  .case-possible-grid{grid-template-columns:repeat(auto-fill,minmax(85px,1fr));gap:8px;padding:0 12px}
  .case-possible-item img{width:44px;height:44px}
  .case-anim-box{width:170px;height:170px}
  .case-anim-text{font-size:18px;letter-spacing:4px}
  .case-result-img-wrap{width:120px;height:120px}
  .case-result-name{font-size:14px}
