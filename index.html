<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Brainrot Zone</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --accent:#f5c542; --accent-deep:#b8860b; --accent-bright:#ffe066;
  --accent-dim:rgba(245,197,66,.3); --accent-very-dim:rgba(245,197,66,.1);
  --green:#2ecc71; --green-bright:#58d68d;
  --bg-main:#050d08; --bg-card:rgba(15,35,22,.7); --bg-panel:#0a190f;
  --text-main:#e5e7eb; --text-muted:#a8adb8;
  --border:rgba(245,197,66,.2);
  --font-ui:'Manrope',sans-serif;
  --font-display:'Unbounded',sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0;user-select:none;font-family:var(--font-ui);font-weight:600}
body{background:var(--bg-main); color:var(--text-main); min-height:100vh; display:flex; flex-direction:column; overflow-x:hidden; -webkit-font-smoothing:antialiased;}

/* ОПТИМИЗИРОВАННЫЙ ФОН (вместо тяжелых видео и блюров) */
#bg-layer{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 20% 30%,rgba(46,204,113,.06) 0,transparent 50%),radial-gradient(circle at 80% 70%,rgba(245,197,66,.06) 0,transparent 50%);pointer-events:none;will-change:transform}

/* ===== ДЕСКТОПНАЯ НАВИГАЦИЯ ===== */
.desktop-nav{
  display:none; background:rgba(10,25,15,.95); border-bottom:1px solid var(--border);
  padding:0 24px; gap:20px; align-items:center; justify-content:center; height:60px;
  position:sticky; top:0; z-index:100;
}
.desktop-nav-btn{
  display:flex; align-items:center; gap:8px; background:transparent; border:none;
  color:var(--text-muted); font-size:13px; font-weight:800; text-transform:uppercase;
  cursor:pointer; padding:0 12px; height:100%; transition:color .2s; letter-spacing:.5px;
}
.desktop-nav-btn svg{width:18px; height:18px;}
.desktop-nav-btn:hover, .desktop-nav-btn.active{color:#fff}
.desktop-nav-btn.active svg{color:var(--accent)}

/* ===== МОБИЛЬНАЯ ШАПКА ===== */
.mobile-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px; background:rgba(10,25,15,.98); border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:100; height:70px;
}
.burger-btn{background:none; border:none; color:#fff; cursor:pointer; padding:8px; display:flex; flex-direction:column; gap:5px;}
.burger-btn span{display:block; width:24px; height:2px; background:#fff; border-radius:2px; transition:.3s}
.logo-wrap{display:flex; align-items:center;}
/* ЛОГОТИП УВЕЛИЧЕН, ЗЕЛЕНАЯ ТОЧКА УБРАНА */
.logo-img{height:76px; width:auto; object-fit:contain; filter:drop-shadow(0 4px 10px rgba(0,0,0,.5)); margin-top:-4px;}
.mobile-balance-pill{display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.08); padding:6px 12px; border-radius:20px; border:1px solid var(--border); font-family:var(--font-display); font-size:12px; color:#fff; cursor:pointer;}

/* ===== ВЫДВИЖНОЕ МЕНЮ (DRAWER) ===== */
.drawer-overlay{position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:1000; opacity:0; pointer-events:none; transition:opacity .3s;}
.drawer-overlay.open{opacity:1; pointer-events:auto;}
.drawer-menu{position:fixed; top:0; left:-320px; width:300px; height:100vh; background:var(--bg-panel); border-right:1px solid var(--border); z-index:1001; transition:left .3s cubic-bezier(0.4,0,0.2,1); display:flex; flex-direction:column; overflow-y:auto;}
.drawer-menu.open{left:0; box-shadow:10px 0 30px rgba(0,0,0,.6)}

/* Блок профиля в меню (как на фото 2) */
.drawer-profile{padding:24px 20px; border-bottom:1px dashed var(--border); margin-bottom:10px;}
.dp-top{display:flex; align-items:center; gap:14px; margin-bottom:16px;}
.dp-avatar{width:52px; height:52px; border-radius:14px; background:linear-gradient(135deg,#6366f1,#a855f7); display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--font-display); font-size:20px; font-weight:900; overflow:hidden; border:1px solid rgba(255,255,255,.2);}
.dp-info{display:flex; flex-direction:column;}
.dp-tg{font-size:11px; color:var(--text-muted); font-weight:700; margin-bottom:2px;}
.dp-nick{font-size:15px; color:#fff; font-weight:800; font-family:var(--font-display);}
.dp-balance{display:flex; align-items:center; justify-content:center; gap:8px; background:rgba(0,0,0,.3); border:1px dashed var(--border); padding:14px; border-radius:12px; font-family:var(--font-display); font-size:18px; font-weight:900; color:#fff; cursor:pointer;}
.dp-balance img{width:22px; height:22px;}
.drawer-nav{display:flex; flex-direction:column; padding:0 12px; gap:4px;}
.drawer-nav-btn{display:flex; align-items:center; gap:14px; padding:16px; background:transparent; border:none; border-radius:12px; color:var(--text-muted); font-size:14px; font-weight:800; cursor:pointer; transition:all .2s; text-align:left;}
.drawer-nav-btn svg{width:20px; height:20px;}
.drawer-nav-btn:hover, .drawer-nav-btn.active{background:rgba(255,255,255,.05); color:#fff;}
.drawer-nav-btn.active svg{color:var(--accent)}

/* ===== ОСНОВНОЙ КОНТЕНТ ===== */
.app{flex:1; padding:20px; max-width:1300px; margin:0 auto; width:100%; display:flex; flex-direction:column;}
.tab-panel{display:none; animation:fadeIn .3s ease;}
.tab-panel.active{display:flex; flex-direction:column;}
@keyframes fadeIn{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:translateY(0)}}

.top-bar-desktop{display:none; justify-content:space-between; align-items:center; margin-bottom:20px; padding-bottom:20px; border-bottom:1px solid var(--border);}
.balance-wrap{display:flex; align-items:center; background:rgba(255,255,255,.06); border:1px solid var(--border); border-radius:10px; overflow:hidden;}
.balance{padding:10px 16px; font-size:14px; font-weight:800; display:flex; align-items:center; gap:8px; color:#fff; font-family:var(--font-display);}
.balance img{width:18px; height:18px;}
.topup-btn{width:42px; height:100%; background:linear-gradient(135deg,var(--accent),var(--amber)); color:#0a1a0f; font-family:var(--font-display); font-size:22px; font-weight:900; border:none; cursor:pointer; border-left:1px solid var(--accent-deep);}
.avatar-desktop{width:42px; height:42px; border-radius:10px; background:linear-gradient(135deg,var(--green),var(--accent)); display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden; border:1px solid var(--border); margin-left:10px;}
.avatar-desktop img{width:100%; height:100%; object-fit:cover;}

/* Общие стили кейсов */
.cases-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:16px;}
@media(min-width:600px){.cases-grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:900px){.cases-grid{grid-template-columns:repeat(4,1fr);}}

.case-card{background:var(--bg-card); border:1px solid var(--border); border-radius:16px; padding:16px; display:flex; flex-direction:column; align-items:center; cursor:pointer; transition:transform .2s, border-color .2s; position:relative;}
.case-card:hover{transform:translateY(-4px); border-color:var(--accent);}
.case-img{width:100px; height:100px; object-fit:contain; margin-bottom:12px; filter:drop-shadow(0 4px 10px rgba(0,0,0,.5));}
.case-name{font-family:var(--font-display); font-size:14px; color:#fff; font-weight:800; text-align:center; margin-bottom:8px;}
.case-price{background:linear-gradient(135deg,var(--accent),var(--amber)); color:#0a1a0f; font-family:var(--font-display); font-size:13px; font-weight:900; padding:6px 14px; border-radius:8px; display:flex; align-items:center; gap:6px;}
.case-price img{width:14px; height:14px;}

/* Магазин / Инвентарь */
.inv-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:12px;}
.shop-scroll{max-height:450px; overflow-y:auto; padding:4px;}
.shop-item{background:rgba(255,255,255,.03); border:1px solid var(--border); border-radius:12px; padding:12px 8px; display:flex; flex-direction:column; align-items:center; transition:transform .2s;}
.shop-item:hover{transform:translateY(-2px); border-color:var(--accent);}
.shop-item img{width:60px; height:60px; object-fit:contain; margin-bottom:8px;}
.shop-item .name{font-size:10px; color:#fff; text-align:center; height:24px; overflow:hidden; margin-bottom:4px;}
.shop-item .price{font-family:var(--font-display); font-size:11px; color:var(--accent-bright); display:flex; align-items:center; gap:4px; margin-bottom:8px;}
.buy-btn, .sell-btn{width:100%; padding:8px; border-radius:6px; border:none; font-family:var(--font-display); font-size:9px; font-weight:900; cursor:pointer; text-transform:uppercase;}
.buy-btn{background:linear-gradient(135deg,var(--green),var(--accent)); color:#0a1a0f;}
.sell-btn{background:var(--accent-very-dim); border:1px solid var(--green-dim); color:var(--green-bright);}

/* Апгрейдер */
.upgrade-container{display:flex; flex-direction:column; align-items:center; padding:20px 0;}
.progress-ring{width:220px; height:220px; border-radius:50%; background:conic-gradient(var(--accent) var(--progress, 0%), rgba(255,255,255,.1) 0); display:flex; align-items:center; justify-content:center; margin-bottom:20px; position:relative; box-shadow:0 0 30px rgba(0,0,0,.5);}
.progress-ring::before{content:''; position:absolute; inset:18px; border-radius:50%; background:var(--bg-panel);}
.progress-text{position:relative; z-index:1; font-family:var(--font-display); font-size:36px; font-weight:900; color:#fff;}
.upgrade-items{display:flex; gap:16px; align-items:center; margin-bottom:24px; width:100%; max-width:450px;}
.upgrade-item{flex:1; background:rgba(255,255,255,.05); border:1px solid var(--border); border-radius:12px; padding:12px; display:flex; flex-direction:column; align-items:center; cursor:pointer;}
.upgrade-item img{width:64px; height:64px; object-fit:contain; margin-bottom:8px;}
.upgrade-item span{font-size:12px; color:#fff; text-align:center;}
.upgrade-action{width:100%; max-width:300px; padding:16px; border-radius:12px; background:linear-gradient(135deg,var(--green),var(--accent)); color:#0a1a0f; font-family:var(--font-display); font-size:16px; font-weight:900; border:none; cursor:pointer;}
.upgrade-action:disabled{opacity:.5; cursor:not-allowed; background:#333;}

/* Модалки (упрощенные) */
.modal{position:fixed; inset:0; background:rgba(0,0,0,.85); display:flex; justify-content:center; align-items:center; z-index:2000; opacity:0; pointer-events:none; transition:opacity .2s; padding:16px;}
.modal.open{opacity:1; pointer-events:auto;}
.modal-card{background:var(--bg-panel); border:1px solid var(--border); border-radius:16px; padding:24px; width:100%; max-width:420px; position:relative; transform:scale(.95); transition:transform .2s; max-height:90vh; overflow-y:auto;}
.modal.open .modal-card{transform:scale(1);}
.modal-close{position:absolute; top:12px; right:12px; background:none; border:none; color:#888; font-size:20px; cursor:pointer; z-index:5;}
.modal-title{font-family:var(--font-display); font-size:18px; color:#fff; margin-bottom:16px; text-align:center;}

/* Кейс рулетка */
.roulette-modal{position:fixed; inset:0; background:var(--bg-main); z-index:3000; display:none; flex-direction:column; padding:20px; overflow-y:auto;}
.roulette-modal.show{display:flex;}
.roulette-header{display:flex; justify-content:space-between; margin-bottom:20px;}
.roulette-window{width:100%; height:140px; background:#000; border:1px solid var(--accent); border-radius:10px; position:relative; overflow:hidden; margin-bottom:20px;}
.roulette-track{display:flex; height:100%; width:max-content; transition:transform 6s cubic-bezier(0.1, 0.9, 0.2, 1); will-change:transform;}
.roulette-item{width:120px; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; border-right:1px solid rgba(255,255,255,.1);}
.roulette-item img{width:60px; height:60px; object-fit:contain; margin-bottom:6px;}
.roulette-pointer{position:absolute; top:0; left:50%; transform:translateX(-50%); width:3px; height:100%; background:var(--accent); z-index:10; box-shadow:0 0 10px var(--accent);}

/* Формы */
.form-group{margin-bottom:16px;}
.form-label{display:block; font-size:11px; color:var(--text-muted); font-weight:800; text-transform:uppercase; margin-bottom:8px;}
.form-input{width:100%; padding:12px; border-radius:8px; border:1px solid var(--border); background:rgba(255,255,255,.05); color:#fff; font-size:14px; outline:none;}
.form-input:focus{border-color:var(--accent);}
.btn-submit{width:100%; padding:14px; border-radius:10px; background:linear-gradient(135deg,var(--green),var(--accent)); color:#0a1a0f; font-family:var(--font-display); font-weight:900; border:none; cursor:pointer; margin-top:10px;}

/* Профиль */
.profile-banner{height:160px; border-radius:16px; background:linear-gradient(135deg,#1a2a1f,#0a190f); margin-bottom:20px; position:relative; border:1px solid var(--border); display:flex; align-items:flex-end; padding:16px; gap:16px;}
.profile-avatar{width:80px; height:80px; border-radius:50%; border:3px solid var(--accent); background:#000; object-fit:cover;}
.profile-info h2{font-family:var(--font-display); font-size:20px; color:#fff;}
.profile-info p{color:var(--accent); font-size:14px; font-weight:700;}
.settings-section{background:rgba(255,255,255,.03); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px;}
.settings-title{font-family:var(--font-display); font-size:14px; color:#fff; margin-bottom:12px;}
.color-grid{display:flex; gap:10px; flex-wrap:wrap;}
.color-swatch{width:32px; height:32px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition:transform .2s;}
.color-swatch.selected{border-color:#fff; transform:scale(1.1);}

/* Адаптив */
@media(min-width:769px){
  .mobile-header{display:none;}
  .desktop-nav{display:flex;}
  .top-bar-desktop{display:flex;}
  .app{padding:30px;}
  .cases-grid{grid-template-columns:repeat(5,1fr);}
  .logo-img{height:90px;} /* Еще больше на ПК */
}
</style>
</head>
<body>

<div id="bg-layer"></div>

<!-- ДЕСКТОПНОЕ МЕНЮ (Сверху) -->
<nav class="desktop-nav">
  <button class="desktop-nav-btn active" data-tab="menu" onclick="switchTab('menu')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 10v10h14V10"/></svg> Главная
  </button>
  <button class="desktop-nav-btn" data-tab="upgrade" onclick="switchTab('upgrade')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg> Апгрейдер
  </button>
  <button class="desktop-nav-btn" data-tab="rocket" onclick="switchTab('rocket')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/></svg> Игры
  </button>
  <button class="desktop-nav-btn" data-tab="rush" onclick="switchTab('rush')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg> Квесты
  </button>
  <button class="desktop-nav-btn" data-tab="promo" onclick="switchTab('promo')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/></svg> Розыгрыши
  </button>
  <button class="desktop-nav-btn" data-tab="profile" onclick="switchTab('profile')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg> Профиль
  </button>
</nav>

<!-- МОБИЛЬНАЯ ШАПКА -->
<header class="mobile-header">
  <button class="burger-btn" onclick="toggleDrawer()">
    <span></span><span></span><span></span>
  </button>
  <div class="logo-wrap">
    <img class="logo-img" src="https://raw.githubusercontent.com/saintezz/ggbrainXv2/main/logotup.png" alt="Brainrot Zone" onerror="this.src='https://github.com/saintezz/ggbrainXv2/raw/main/logotup.png'">
  </div>
  <div class="mobile-balance-pill" onclick="openTopup()">
    <span id="mobBalanceDisplay">0</span>
    <img src="https://raw.githubusercontent.com/saintezz/saintbetW/main/%D0%BC%D0%BE%D0%BD%D0%B5%D1%82%D0%B0.png" style="width:16px;height:16px;" alt="coin">
  </div>
</header>

<!-- ВЫДВИЖНОЕ МЕНЮ (Мобилки) -->
<div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
<aside class="drawer-menu" id="drawerMenu">
  <div class="drawer-profile">
    <div class="dp-top">
      <div class="dp-avatar" id="drawerAvatar">SB</div>
      <div class="dp-info">
        <div class="dp-tg">Telegram</div>
        <div class="dp-nick" id="drawerNick">@clonexx7</div>
      </div>
    </div>
    <div class="dp-balance" onclick="openTopup()">
      <span id="drawerBalance">0</span>
      <img src="https://raw.githubusercontent.com/saintezz/saintbetW/main/%D0%BC%D0%BE%D0%BD%D0%B5%D1%82%D0%B0.png" alt="coin">
    </div>
  </div>
  <div class="drawer-nav">
    <button class="drawer-nav-btn active" data-tab="menu" onclick="switchTab('menu')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 10v10h14V10"/></svg> Главная
    </button>
    <button class="drawer-nav-btn" data-tab="upgrade" onclick="switchTab('upgrade')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg> Апгрейдер
    </button>
    <button class="drawer-nav-btn" data-tab="rocket" onclick="switchTab('rocket')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/></svg> Игры
    </button>
    <button class="drawer-nav-btn" data-tab="rush" onclick="switchTab('rush')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg> Квесты
    </button>
    <button class="drawer-nav-btn" data-tab="promo" onclick="switchTab('promo')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/></svg> Розыгрыши
    </button>
    <button class="drawer-nav-btn" data-tab="profile" onclick="switchTab('profile')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg> Профиль
    </button>
  </div>
</aside>

<!-- ОСНОВНОЙ КОНТЕНТ -->
<main class="app">
  <!-- Верхняя панель для ПК -->
  <div class="top-bar-desktop">
    <h2 style="font-family:var(--font-display);font-size:24px;color:#fff;" id="desktopTabTitle">Главная</h2>
    <div style="display:flex; align-items:center;">
      <div class="balance-wrap">
        <div class="balance">
          <img src="https://raw.githubusercontent.com/saintezz/saintbetW/main/%D0%BC%D0%BE%D0%BD%D0%B5%D1%82%D0%B0.png" alt="coin">
          <span id="desktopBalance">0</span>
        </div>
        <button class="topup-btn" onclick="openTopup()">+</button>
      </div>
      <div class="avatar-desktop" onclick="switchTab('profile')">
        <img id="desktopAvatarImg" src="https://raw.githubusercontent.com/saintezz/ggbrainXv2/main/avavatarochka.jpg" alt="avatar">
      </div>
    </div>
  </div>

  <!-- ГЛАВНАЯ (КЕЙСЫ) -->
  <div class="tab-panel active" id="panelMenu">
    <div class="cases-grid" id="menuCasesGrid"></div>
  </div>

  <!-- АПГРЕЙДЕР -->
  <div class="tab-panel" id="panelUpgrade">
    <div class="upgrade-container">
      <div class="progress-ring" id="progressRing" style="--progress: 0%;">
        <div class="progress-text" id="upgradeChanceText">0%</div>
      </div>

<script>
// ======== ДАННЫЕ ========
const COIN_IMG = 'https://raw.githubusercontent.com/saintezz/saintbetW/main/%D0%BC%D0%BE%D0%BD%D0%B5%D1%82%D0%B0.png';
const DEFAULT_AVATAR = 'https://raw.githubusercontent.com/saintezz/ggbrainXv2/main/avavatarochka.jpg';
const API_URL = 'https://ggbrainx.onrender.com';

const ITEMS = [
  { id: 'cupid', name: 'Cupid Wings', price: 34, img: 'https://raw.githubusercontent.com/forerer-afk/brainroterX/main/cupid-wings.png' },
  { id: 'garama', name: 'Garama', price: 41, img: 'https://raw.githubusercontent.com/forerer-afk/brainroterX/main/garama.png' },
  { id: 'burguro', name: 'Burguro', price: 70, img: 'https://raw.githubusercontent.com/forerer-afk/brainroterX/main/burguru.png' },
  { id: 'popcuru', name: 'Popcuru', price: 87, img: 'https://raw.githubusercontent.com/forerer-afk/brainroterX/main/popcuru.png' },
  { id: 'celestial', name: 'Celestial Pegasus', price: 93, img: 'https://raw.githubusercontent.com/forerer-afk/brainroterX/main/celestialpegasus.png' },
  { id: 'lafood', name: 'La Food', price: 103, img: 'https://raw.githubusercontent.com/forerer-afk/brainroterX/main/lafoodcombinasion.png' },
  { id: 'cooki', name: 'Cooki & Milki', price: 130, img: 'https://raw.githubusercontent.com/forerer-afk/brainroterX/main/cookiandmilki.png' },
  { id: 'jolly', name: 'Jolly Sahur', price: 132, img: 'https://raw.githubusercontent.com/forerer-afk/brainroterX/main/jollyjollysahur.png' },
  { id: 'cerberus', name: 'Cerberus', price: 155, img: 'https://raw.githubusercontent.com/forerer-afk/brainroterX/main/cerberus.png' },
  { id: 'globba', name: 'Globba Steppa', price: 164, img: 'https://raw.githubusercontent.com/forerer-afk/brainroterX/main/globastepa.png' },
  { id: 'losamigos', name: 'Los Amigos', price: 220, img: 'https://raw.githubusercontent.com/forerer-afk/brainroterX/main/losamigos.png' },
  { id: 'dragon', name: 'Dragon Cannelloni', price: 890, img: 'https://raw.githubusercontent.com/forerer-afk/brainroterX/main/dragoncannelloni.png' },
  { id: 'skibidi', name: 'Skibidi Toilet', price: 13154, img: 'https://raw.githubusercontent.com/forerer-afk/brainroterX/main/skibidi-toilet.png' }
];

const CASES = [
  { id: 'og', name: 'OG CASE', price: 12000, img: 'https://raw.githubusercontent.com/saintezz/ggbrainXv2/main/OGCASE.png',
    rewards: [ { itemId: 'skibidi', chance: 80 }, { itemId: 'dragon', chance: 20 } ] },
  { id: 'tacos', name: 'TACOS CASE', price: 169, img: 'https://raw.githubusercontent.com/saintezz/ggbrainXv2/main/tacoscase.png',
    rewards: [ { itemId: 'garama', chance: 70 }, { itemId: 'burguro', chance: 30 } ] },
  { id: 'free', name: 'FREE CASE', price: 0, img: 'https://raw.githubusercontent.com/saintezz/ggbrainXv2/main/FREECASE.png',
    rewards: [ { balance: 5, chance: 90 }, { itemId: 'cupid', chance: 10 } ] },
  { id: 'easter', name: 'EASTER CASE', price: 45, img: 'https://raw.githubusercontent.com/saintezz/ggbrainXv2/main/eastercase.png',
    rewards: [ { balance: 20, chance: 80 }, { itemId: 'cupid', chance: 20 } ] }
];

// ======== СОСТОЯНИЕ ========
let USER = { nick: 'Гость', tg: '@guest', id: null, username: null };
let balance = parseFloat(localStorage.getItem('bz_balance') || '1000');
let inventory = JSON.parse(localStorage.getItem('bz_inventory') || '[]');
let customNick = localStorage.getItem('bz_custom_nick') || null;
let customAvatar = localStorage.getItem('bz_custom_avatar') || null;
let accentColor = localStorage.getItem('bz_accent') || '#f5c542';
let isAdmin = false;

let upSource = null;
let upTarget = null;
let isSpinning = false;

let rocketState = 'idle';
let rocketBet = 0;
let rocketX = 1.00;
let rocketCrash = 1.00;
let rocketTimer = null;

let rushStep = 0;
let rushActive = false;

let currentCase = null;
let rouletteItems = [];

// ======== БАЗОВЫЕ ФУНКЦИИ ========
function save() {
  localStorage.setItem('bz_balance', balance);
  localStorage.setItem('bz_inventory', JSON.stringify(inventory));
}

function getTelegramId() {
  if (USER.id) return String(USER.id);
  let gid = localStorage.getItem('bz_guest');
  if (!gid) { gid = 'guest_' + Math.random().toString(36).slice(2); localStorage.setItem('bz_guest', gid); }
  return gid;
}

function updateBalanceUI() {
  const b = balance.toLocaleString('ru-RU');
  const dB = document.getElementById('desktopBalance');
  const mB = document.getElementById('mobBalanceDisplay');
  const drB = document.getElementById('drawerBalance');
  const pB = document.getElementById('profileBalance');
  const pI = document.getElementById('profileItemsCount');
  if(dB) dB.innerText = b;
  if(mB) mB.innerText = b;
  if(drB) drB.innerText = b;
  if(pB) pB.innerText = b;
  if(pI) pI.innerText = inventory.length;
  save();
}

function updateProfileUI() {
  const nick = customNick || USER.nick;
  const avatar = customAvatar || DEFAULT_AVATAR;
  
  const dN = document.getElementById('drawerNick');
  if(dN) dN.innerText = nick;
  
  const dpAv = document.getElementById('drawerAvatar');
  if(dpAv) dpAv.innerHTML = `<img src="${avatar}" style="width:100%;height:100%;object-fit:cover;">`;
  
  const pN = document.getElementById('profileNick');
  if(pN) pN.innerText = nick;
  
  const pT = document.getElementById('profileTg');
  if(pT) pT.innerText = USER.tg;
  
  const pA = document.getElementById('profileAvatarImg');
  if(pA) pA.src = avatar;
  
  const dA = document.getElementById('desktopAvatarImg');
  if(dA) dA.src = avatar;
}

// ======== НАВИГАЦИЯ ========
window.switchTab = function(tabId) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  const panel = document.getElementById('panel' + tabId.charAt(0).toUpperCase() + tabId.slice(1));
  if(panel) panel.classList.add('active');

  document.querySelectorAll('.desktop-nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));
  document.querySelectorAll('.drawer-nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));

  const titles = { menu: 'Главная', upgrade: 'Апгрейдер', rocket: 'Игры', rush: 'Квесты', promo: 'Розыгрыши', profile: 'Профиль' };
  const titleEl = document.getElementById('desktopTabTitle');
  if(titleEl) titleEl.innerText = titles[tabId] || 'Brainrot Zone';

  if(window.innerWidth <= 768) toggleDrawer(false);
};

window.toggleDrawer = function(force) {
  const m = document.getElementById('drawerMenu');
  const o = document.getElementById('drawerOverlay');
  if(!m || !o) return;
  const open = typeof force === 'boolean' ? force : !m.classList.contains('open');
  m.classList.toggle('open', open);
  o.classList.toggle('open', open);
  document.body.style.overflow = open ? 'hidden' : '';
};

window.openModal = function(id) { const el = document.getElementById(id); if(el) el.classList.add('open'); };
window.closeModal = function(id) { const el = document.getElementById(id); if(el) el.classList.remove('open'); };
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if(e.target === m) m.classList.remove('open'); }));

// ======== КЕЙСЫ ========
function renderCases() {
  const grid = document.getElementById('menuCasesGrid');
  if(!grid) return;
  grid.innerHTML = CASES.map(c => `
    <div class="case-card" onclick="openCase('${c.id}')">
      <img class="case-img" src="${c.img}" loading="lazy">
      <div class="case-name">${c.name}</div>
      <div class="case-price ${c.price === 0 ? 'free' : ''}">
        ${c.price === 0 ? 'FREE' : c.price}
        ${c.price !== 0 ? `<img src="${COIN_IMG}">` : ''}
      </div>
    </div>
  `).join('');
}

window.openCase = function(id) {
  currentCase = CASES.find(c => c.id === id);
  if(!currentCase) return;
  document.getElementById('rouletteCaseName').innerText = currentCase.name;
  document.getElementById('openCasePrice').innerText = currentCase.price;
  document.getElementById('rouletteResult').style.opacity = 0;
  
  const track = document.getElementById('rouletteTrack');
  rouletteItems = [];
  for(let i=0; i<30; i++) {
    const r = currentCase.rewards[Math.floor(Math.random()*currentCase.rewards.length)];
    if(r.itemId) {
      const it = ITEMS.find(x=>x.id===r.itemId);
      rouletteItems.push({ img: it.img, name: it.name });
    } else {
      rouletteItems.push({ img: COIN_IMG, name: r.balance + ' монет' });
    }
  }
  track.innerHTML = rouletteItems.map(it => `
    <div class="roulette-item">
      <img src="${it.img}">
      <span style="font-size:10px;color:#fff;text-align:center;margin-top:5px;">${it.name}</span>
    </div>
  `).join('');
  
  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';
  document.getElementById('rouletteModal').classList.add('show');
};

window.closeRoulette = function() {
  document.getElementById('rouletteModal').classList.remove('show');
};

window.openCaseAction = function() {
  if(!currentCase) return;
  if(currentCase.price > balance) { alert('Недостаточно монет!'); return; }
  if(currentCase.id !== 'free') {
    balance -= currentCase.price;
    updateBalanceUI();
  }
  
  const btn = document.getElementById('openCaseBtn');
  btn.disabled = true;
  
  const track = document.getElementById('rouletteTrack');
  const totalChance = currentCase.rewards.reduce((s,r)=>s+r.chance,0);
  let rnd = Math.random() * totalChance;
  let winReward = currentCase.rewards[0];
  for(const r of currentCase.rewards) {
    if(rnd < r.chance) { winReward = r; break; }
    rnd -= r.chance;
  }
  
  const winIndex = 20;
  const winImg = winReward.itemId ? ITEMS.find(x=>x.id===winReward.itemId).img : COIN_IMG;
  const winName = winReward.itemId ? ITEMS.find(x=>x.id===winReward.itemId).name : winReward.balance + ' монет';
  rouletteItems[winIndex] = { img: winImg, name: winName };
  
  track.innerHTML = rouletteItems.map(it => `
    <div class="roulette-item">
      <img src="${it.img}">
      <span style="font-size:10px;color:#fff;text-align:center;margin-top:5px;">${it.name}</span>
    </div>
  `).join('');
  
  const offset = (winIndex * 120) - (track.parentElement.clientWidth / 2) + 60;
  track.style.transition = 'transform 6s cubic-bezier(0.1, 0.9, 0.2, 1)';
  track.style.transform = `translateX(-${offset}px)`;
  
  setTimeout(() => {
    btn.disabled = false;
    if(winReward.itemId) {
      inventory.push(winReward.itemId);
    } else {
      balance += winReward.balance;
    }
    updateBalanceUI();
    
    const resEl = document.getElementById('rouletteResult');
    resEl.innerText = `Выигрыш: ${winName}!`;
    resEl.style.opacity = 1;
  }, 6200);
};

// ======== АПГРЕЙДЕР ========
window.openTargetList = function(type) {
  const list = document.getElementById('targetList');
  if(type === 'source') {
    if(inventory.length === 0) { alert('Инвентарь пуст'); return; }
    list.innerHTML = inventory.map((id, i) => {
      const it = ITEMS.find(x=>x.id===id);
      if(!it) return '';
      return `<div style="display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #333;cursor:pointer;" onclick="selectUpSource(${i})">
        <img src="${it.img}" style="width:40px;height:40px;">
        <div style="flex:1;color:#fff;">${it.name}</div>
        <div style="color:var(--accent);">${it.price}</div>
      </div>`;
    }).join('');
  } else {
    list.innerHTML = ITEMS.map(it => `
      <div style="display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #333;cursor:pointer;" onclick="selectUpTarget('${it.id}')">
        <img src="${it.img}" style="width:40px;height:40px;">
        <div style="flex:1;color:#fff;">${it.name}</div>
        <div style="color:var(--accent);">${it.price}</div>
      </div>
    `).join('');
  }
  openModal('targetModal');
};

window.selectUpSource = function(idx) {
  upSource = idx;
  const it = ITEMS.find(x=>x.id===inventory[idx]);
  if(!it) return;
  document.getElementById('upSourceImg').src = it.img;
  document.getElementById('upSourceImg').style.display = 'block';
  document.getElementById('upSourceName').innerText = it.name;
  closeModal('targetModal');
  updateUpgradeChance();
};

window.selectUpTarget = function(id) {
  upTarget = id;
  const it = ITEMS.find(x=>x.id===id);
  if(!it) return;
  document.getElementById('upTargetImg').src = it.img;
  document.getElementById('upTargetImg').style.display = 'block';
  document.getElementById('upTargetName').innerText = it.name;
  closeModal('targetModal');
  updateUpgradeChance();
};

function updateUpgradeChance() {
  if(upSource === null || !upTarget) return;
  const s = ITEMS.find(x=>x.id===inventory[upSource]);
  const t = ITEMS.find(x=>x.id===upTarget);
  if(!s || !t || t.price <= s.price) { 
    document.getElementById('upgradeChanceText').innerText = '0%';
    document.getElementById('progressRing').style.setProperty('--progress', '0%');
    document.getElementById('upgradeBtn').disabled = true;
    return; 
  }
  let chance = Math.round((s.price / t.price) * 100);
  if(chance > 70) chance = 70;
  if(chance < 1) chance = 1;
  
  document.getElementById('upgradeChanceText').innerText = chance + '%';
  document.getElementById('progressRing').style.setProperty('--progress', chance + '%');
  document.getElementById('upgradeBtn').disabled = false;
}

window.doUpgrade = function() {
  if(isSpinning) return;
  if(upSource === null || !upTarget) return;
  const s = ITEMS.find(x=>x.id===inventory[upSource]);
  const t = ITEMS.find(x=>x.id===upTarget);
  if(!s || !t) return;
  
  const chance = parseFloat(document.getElementById('upgradeChanceText').innerText);
  isSpinning = true;
  document.getElementById('upgradeBtn').disabled = true;
  document.getElementById('upgradeBtn').innerText = 'Крутим...';
  
  setTimeout(() => {
    const win = Math.random() * 100 <= chance;
    if(win) {
      inventory.splice(upSource, 1);
      inventory.push(t.id);
      alert('УСПЕХ! Вы получили ' + t.name);
    } else {
      inventory.splice(upSource, 1);
      alert('ПРОВАЛ... Предмет сгорел');
    }
    
    upSource = null;
    upTarget = null;
    document.getElementById('upSourceImg').style.display = 'none';
    document.getElementById('upTargetImg').style.display = 'none';
    document.getElementById('upSourceName').innerText = 'Выбрать';
    document.getElementById('upTargetName').innerText = 'Выбрать';
    document.getElementById('upgradeChanceText').innerText = '0%';
    document.getElementById('progressRing').style.setProperty('--progress', '0%');
    document.getElementById('upgradeBtn').innerText = 'Апгрейд';
    document.getElementById('upgradeBtn').disabled = true;
    isSpinning = false;
    updateBalanceUI();
  }, 2000);
};

// ======== РАКЕТКА ========
window.rocketAction = function() {
  if(rocketState === 'idle') {
    const bet = parseFloat(document.getElementById('rocketBetInput').value);
    if(!bet || bet > balance) { alert('Недостаточно монет'); return; }
    rocketBet = bet;
    balance -= bet;
    updateBalanceUI();
    rocketState = 'flying';
    rocketX = 1.00;
    rocketCrash = 1.0 + Math.random() * 5;
    if(Math.random() < 0.3) rocketCrash = 1.0;
    
    document.getElementById('rocketBtn').innerText = 'ЗАБРАТЬ';
    document.getElementById('rocketBtn').style.background = 'var(--accent)';
    
    let start = performance.now();
    function tick() {
      if(rocketState !== 'flying') return;
      let el = (performance.now() - start) / 1000;
      rocketX = Math.exp(0.2 * el);
      if(rocketX > 20) rocketX = 20;
      
      document.getElementById('rocketXDisplay').innerText = rocketX.toFixed(2) + 'x';
      const sp = document.getElementById('rocketSprite');
      sp.style.left = (10 + (rocketX/20)*80) + '%';
      sp.style.bottom = (10 + (rocketX/20)*70) + '%';
      
      if(rocketX >= rocketCrash) {
        rocketState = 'crashed';
        document.getElementById('rocketBtn').innerText = 'КРАШ';
        document.getElementById('rocketBtn').style.background = '#ff4444';
        document.getElementById('rocketXDisplay').style.color = '#ff4444';
        setTimeout(() => {
          rocketState = 'idle';
          document.getElementById('rocketBtn').innerText = 'СТАРТ';
          document.getElementById('rocketBtn').style.background = 'var(--green)';
          document.getElementById('rocketXDisplay').style.color = '#fff';
          document.getElementById('rocketXDisplay').innerText = '1.00x';
          document.getElementById('rocketSprite').style.left = '10px';
          document.getElementById('rocketSprite').style.bottom = '10px';
        }, 2000);
        return;
      }
      requestAnimationFrame(tick);
    }
    tick();
  } else if(rocketState === 'flying') {
    rocketState = 'idle';
    const win = Math.floor(rocketBet * rocketX);
    balance += win;
    updateBalanceUI();
    alert(`Вы забрали ${win} монет на ${rocketX.toFixed(2)}x`);
    document.getElementById('rocketBtn').innerText = 'СТАРТ';
    document.getElementById('rocketBtn').style.background = 'var(--green)';
    document.getElementById('rocketXDisplay').innerText = '1.00x';
    document.getElementById('rocketSprite').style.left = '10px';
    document.getElementById('rocketSprite').style.bottom = '10px';
  }
};

// ======== КВЕСТЫ (RUSH) ========
window.rushAction = function() {
  if(!rushActive) {
    const bet = parseFloat(document.getElementById('rushBetInput').value);
    if(!bet || bet > balance) { alert('Недостаточно монет'); return; }
    balance -= bet;
    updateBalanceUI();
    rushActive = true;
    rushStep = 0;
    document.getElementById('rushBtn').innerText = 'БРОСИТЬ';
    renderRushBoard();
    return;
  }
  
  const dice = 1 + Math.floor(Math.random()*6);
  document.getElementById('rushDiceResult').innerText = '🎲 ' + dice;
  
  rushStep += dice;
  if(rushStep > 30) rushStep = 30;
  
  renderRushBoard();
  
  if(rushStep === 30) {
    alert('ФИНИШ! Вы выиграли x2 от ставки!');
    balance += parseFloat(document.getElementById('rushBetInput').value) * 2;
    updateBalanceUI();
    rushActive = false;
    rushStep = 0;
    document.getElementById('rushBtn').innerText = 'СДЕЛАТЬ СТАВКУ';
    renderRushBoard();
  }
};

function renderRushBoard() {
  const board = document.getElementById('rushBoard');
  if(!board) return;
  let html = '';
  for(let i=1; i<=30; i++) {
    let bg = 'rgba(255,255,255,.05)';
    if(i === rushStep) bg = 'var(--accent)';
    else if(i % 5 === 0) bg = 'rgba(255,100,100,.2)';
    html += `<div style="height:30px;border-radius:4px;background:${bg};display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;">${i}</div>`;
  }
  board.innerHTML = html;
}

// ======== ПРОМО ========
window.activatePromo = function() {
  const code = document.getElementById('promoInput').value.trim().toUpperCase();
  const msg = document.getElementById('promoMsg');
  if(!code) return;
  if(code === 'START') {
    balance += 500;
    updateBalanceUI();
    msg.style.color = 'var(--green)';
    msg.innerText = '+500 монет!';
    document.getElementById('promoInput').value = '';
  } else {
    msg.style.color = '#ff4444';
    msg.innerText = 'Неверный промокод';
  }
};

// ======== ПРОФИЛЬ ========
window.handleAvatarUpload = function(e) {
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ev => {
    customAvatar = ev.target.result;
    localStorage.setItem('bz_custom_avatar', customAvatar);
    updateProfileUI();
  };
  r.readAsDataURL(f);
};

window.saveCustomNick = function() {
  const v = document.getElementById('customizeNickInput').value.trim();
  if(v) {
    customNick = v;
    localStorage.setItem('bz_custom_nick', v);
    updateProfileUI();
  }
};

function renderColorGrid() {
  const colors = ['#f5c542','#10b981','#a3e635','#14b8a6','#06b6d4','#3b82f6','#a855f7','#ec4899','#ef4444'];
  const grid = document.getElementById('colorGrid');
  if(!grid) return;
  grid.innerHTML = colors.map(c => `
    <div class="color-swatch ${c===accentColor?'selected':''}" style="background:${c}" onclick="changeAccent('${c}')"></div>
  `).join('');
}

window.changeAccent = function(c) {
  accentColor = c;
  localStorage.setItem('bz_accent', c);
  document.documentElement.style.setProperty('--accent', c);
  renderColorGrid();
};
